name: Verify public Adsterra setup

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-advertising:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Adsterra placements are in the public HTML
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            HTML="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://www.quinnoa.com/?adsterra-check=${GITHUB_RUN_ID}-${attempt}")" || HTML=''
            if grep -Fq 'highrevenueformat.com' <<< "$HTML" && ! grep -Fq 'profitableratecpmnetwork.com/7db463293bb3ce15ac447767c0af596a/invoke.js' <<< "$HTML"; then
              echo "SEO recovery ad profile is live: responsive unit present, native unit suppressed."
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: SEO recovery ad profile is not present in the public frontend."
          exit 1
