          cp content/articles/es/454-se-pueden-comer-platanos-muy-maduros-negros.json priority09-source/content/articles/es/
          cp content/articles/en/478-fermentation-vs-pickling.json priority09-source/content/articles/en/
          cp content/articles/es/478-fermentacion-vs-encurtido-diferencias.json priority09-source/content/articles/es/
          cp content/articles/en/578-whole-vs-nonfat-yogurt.json priority09-source/content/articles/en/
          cp content/articles/es/578-yogur-entero-vs-desnatado-que-cambia.json priority09-source/content/articles/es/
          cp content/articles/en/217-how-long-cooked-chickpeas-fridge.json priority09-source/content/articles/en/
          cp content/articles/es/217-cuanto-duran-garbanzos-cocidos-nevera.json priority09-source/content/articles/es/
