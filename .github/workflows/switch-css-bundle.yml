name: Switch Quinnoa CSS runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/switch-css-bundle.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace individual UI stylesheets with bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/css/quinnoa-ui.css
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('header.php')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"\t<\?php\n\t\$css_files = array\(.*?\t<\?php endforeach; \?>\n", re.S)
          replacement = (
              "\t<?php $food_ui_css = get_template_directory() . '/assets/css/quinnoa-ui.css'; ?>\n"
              "\t<?php if ( file_exists( $food_ui_css ) ) : ?>\n"
              "\t\t<link rel=\"stylesheet\" href=\"<?php echo esc_url( get_template_directory_uri() . '/assets/css/quinnoa-ui.css?ver=' . filemtime( $food_ui_css ) ); ?>\">\n"
              "\t<?php endif; ?>\n"
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy CSS block, replaced {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Validate PHP
        run: php -l header.php

      - name: Commit runtime switch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- header.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add header.php
          git commit -m 'Reduce Quinnoa runtime CSS requests'
          git push
