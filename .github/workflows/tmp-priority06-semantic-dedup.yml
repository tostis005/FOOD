name: Temporary priority 06 semantic dedup

on:
  push:
    paths:
      - '.tmp/p06dedup.*'
      - '.github/workflows/tmp-priority06-semantic-dedup.yml'

permissions:
  contents: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality-priority-06
      - name: Rebuild article-specific expansions
        shell: bash
        run: |
          cat .tmp/p06dedup.* > /tmp/p06dedup.b64
          base64 -d /tmp/p06dedup.b64 | gzip -d > /tmp/p06dedup.py
          python3 /tmp/p06dedup.py
      - name: Focused quality validation
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,html,collections,pathlib,sys
          ids={273,198,259,277,107,148,231,242,328,204,582,123,596,236,254,154,541,444,142,232}
          forbidden=['merece un artículo','merece otro artículo','otro artículo','en este artículo','hemos elegido','hemos usado','hemos utilizado','deliberadamente','se excluye deliberadamente','excluimos deliberadamente','para no manipular','criterio de ordenación','fuentes y criterio','registro utilizado','registros concretos','la tabla no pretende','no pretendemos','cocinado con calor seco','tabla principal','ranking principal','tabla anterior','ranking anterior','la tabla de arriba','el ranking de arriba','como vimos','como hemos visto','en otra guía','en otra entrada','en otro post','en otra página','deserves its own article','another article','in this article','we chose','we have chosen','we used','we have used','deliberately','to avoid manipulating','ordering criteria','sources and methodology','record used','specific records','the table is not intended','cooked by dry heat','main table','main ranking','previous table','previous ranking','the table above','the ranking above','as we saw','as we have seen','in another guide','in another article','in another post','on another page']
          for lang in ('es','en'):
              long_paras=collections.defaultdict(set)
              seen=set()
              for n in sorted(ids):
                  matches=list(pathlib.Path(f'content/articles/{lang}').glob(f'{n:03d}-*.json'))
                  assert len(matches)==1,(lang,n,matches)
                  d=json.loads(matches[0].read_text())
                  assert d['article_number']==n and d['language']==lang and d['status']=='publish'
                  assert d.get('translation_group')
                  c=d['content_html']
                  text=html.unescape(re.sub(r'<[^>]+>',' ',c)); text=re.sub(r'\s+',' ',text).strip()
                  words=re.findall(r"\b[^\W_]+(?:['’\-][^\W_]+)*\b",text,re.UNICODE)
                  h2=len(re.findall(r'<h2\b',c,re.I))
                  assert len(words)>=631,(lang,n,len(words))
                  assert h2<5 or len(words)/h2>=80,(lang,n,len(words),h2)
                  plain=text.lower()
                  assert not any(x in plain for x in forbidden),(lang,n,'forbidden')
                  excerpt=re.sub(r'\s+',' ',str(d.get('excerpt',''))).strip().lower()
                  assert not (excerpt and excerpt in plain),(lang,n,'excerpt-repeat')
                  seen.add(n)
                  for m in re.findall(r'<p[^>]*>(.*?)</p>',c,re.S|re.I):
                      p=html.unescape(re.sub(r'<[^>]+>',' ',m)); p=re.sub(r'\s+',' ',p).strip()
                      if len(p.split())>=25: long_paras[p].add(n)
              assert seen==ids
              dup={p:ns for p,ns in long_paras.items() if len(ns)>1}
              assert not dup,[(sorted(ns),p[:120]) for p,ns in dup.items()]
          for n in sorted(ids):
              es=json.loads(next(pathlib.Path('content/articles/es').glob(f'{n:03d}-*.json')).read_text())
              en=json.loads(next(pathlib.Path('content/articles/en').glob(f'{n:03d}-*.json')).read_text())
              assert es['translation_group']==en['translation_group']
          print('PRIORITY06_FOCUSED_VALIDATION=PASS')
          PY
          set +e
          python3 content/tools/audit-article-editorial.py content/articles > /tmp/editorial.txt 2>&1
          set -e
          python3 - <<'PY'
          import re
          ids={273,198,259,277,107,148,231,242,328,204,582,123,596,236,254,154,541,444,142,232}
          txt=open('/tmp/editorial.txt').read()
          m=re.search(r'^FAILED_PAIR_IDS=(.*)$',txt,re.M)
          assert m,'FAILED_PAIR_IDS missing'
          failed={int(x) for x in m.group(1).split(',') if x.strip()}
          overlap=sorted(ids & failed)
          print('PRIORITY06_FAILED_OVERLAP='+','.join(map(str,overlap)))
          assert not overlap,overlap
          PY
      - name: Commit article corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/es content/articles/en
          git diff --cached --quiet && exit 0
          git commit -m 'Replace shared expansion copy in priority block 06'
          git push origin HEAD:quality-priority-06
