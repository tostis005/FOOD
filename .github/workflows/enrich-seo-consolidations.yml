name: Enrich canonical SEO articles

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/SEO-CONSOLIDATIONS.json'
      - 'content/tools/enrich-seo-consolidations.py'
      - '.github/workflows/enrich-seo-consolidations.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quinnoa-seo-consolidation-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge sources and FAQs into canonical articles
        run: |
          set -euo pipefail
          python3 content/tools/enrich-seo-consolidations.py

      - name: Commit canonical enrichment
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/articles/es content/articles/en; then
            echo "Canonical articles already contain all useful source material."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en
          git commit -m "Enrich canonical consolidated articles"
          git push origin HEAD:main
