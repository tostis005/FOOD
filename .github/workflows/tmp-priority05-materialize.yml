name: Finalize priority block 05
on:
  push:
    branches:
      - tmp-quality-priority-05-materialize
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exactly 40 JSON to final branch and commit
        shell: bash
        run: |
          set -euo pipefail
          BASE='ff7d91aa0b38751129637341ae1dda2c9d9dc8f0'
          FINAL_BRANCH='quality-priority-05'
          IDS=(265 540 447 448 469 229 238 565 256 108 690 263 267 551 225 271 281 128 248 239)

          git fetch origin "$FINAL_BRANCH" main
          test "$(git rev-parse "origin/$FINAL_BRANCH")" = "$BASE"
          git merge-base --is-ancestor "$BASE" origin/main

          git worktree add --detach /tmp/priority05-final "origin/$FINAL_BRANCH"

          expected=()
          for lang in es en; do
            for id in "${IDS[@]}"; do
              shopt -s nullglob
              matches=(content/articles/$lang/${id}-*.json)
              shopt -u nullglob
              test "${#matches[@]}" -eq 1
              src="${matches[0]}"
              git diff --quiet "$BASE" origin/main -- "$src"
              expected+=("$src")
              mkdir -p "/tmp/priority05-final/$(dirname "$src")"
              cp "$src" "/tmp/priority05-final/$src"
            done
          done

          cd /tmp/priority05-final
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          test "${#changed[@]}" -eq 40
          test "$(printf '%s\n' "${changed[@]}" | grep -c '^content/articles/es/')" -eq 20
          test "$(printf '%s\n' "${changed[@]}" | grep -c '^content/articles/en/')" -eq 20
          test "$(printf '%s\n' "${changed[@]}" | grep -vc '^content/articles/\(es\|en\)/')" -eq 0

          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 40
          test "$(git diff --cached --name-only | grep -c '^content/articles/es/')" -eq 20
          test "$(git diff --cached --name-only | grep -c '^content/articles/en/')" -eq 20
          test "$(git diff --cached --name-only | grep -vc '^content/articles/\(es\|en\)/')" -eq 0

          git commit -m 'Improve editorial quality for priority block 05'
          git push origin HEAD:"$FINAL_BRANCH"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo 'FINAL_DIFF_COUNT=40'
          echo 'FINAL_ES_COUNT=20'
          echo 'FINAL_EN_COUNT=20'
