name: Fix priority block 05 EN 565
on:
  push:
    branches:
      - tmp-quality-priority-05-materialize
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality-priority-05
          fetch-depth: 0
      - name: Replace mismatched EN 565 paragraph and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, math, re
          from pathlib import Path

          p = Path('content/articles/en/565-seitan-vs-tofu-vs-tempeh-nutrition.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          old = "<p>Chicken breast is best treated as a protein food, not as a meaningful carbohydrate source. Plain roasted, grilled, poached, or baked breast meat contributes virtually no carbs on its own, while the carbohydrate count can rise quickly when breading, sweet glazes, barbecue sauce, marinades with sugar, or side dishes are included. If you track macros, check the preparation rather than judging the ingredient name alone. Portion size also matters for protein: a larger cooked breast can provide much more protein than a small serving, even though the carb content of the plain meat remains negligible.</p>"
          new = "<p>Serving size can change how the comparison feels at the table. A typical tofu or tempeh portion may be larger than a compact serving of seitan, so protein per 100 g is useful for comparing concentration but does not automatically predict what you will eat in one meal. Prepared products also vary: flavored tofu, marinated tempeh and seasoned seitan can add sodium, sugar or oil. If you are choosing among them for everyday meals, compare the nutrition label at the portion you actually use and consider protein alongside fiber, calcium, sodium, total calories and dietary restrictions such as soy or gluten avoidance.</p>"
          assert old in d['content_html']
          d['content_html'] = d['content_html'].replace(old, new, 1)
          assert old not in d['content_html']
          text = re.sub(r'<[^>]+>', ' ', d['content_html'])
          text = re.sub(r'\s+', ' ', html.unescape(text)).strip()
          words = len(re.findall(r"\b[^\W_]+(?:['’\-][^\W_]+)*\b", text, flags=re.UNICODE))
          h2 = len(re.findall(r'<h2\b', d['content_html'], flags=re.I))
          assert words >= 631, words
          assert math.ceil(words / 210) >= 4, words
          if h2 >= 5:
              assert words / h2 >= 80, (words, h2)
          assert 'chicken breast is best treated' not in text.lower()
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('EN565_WORDS', words)
          print('EN565_H2', h2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/en/565-seitan-vs-tofu-vs-tempeh-nutrition.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Fix EN 565 plant protein comparison'
          git push origin HEAD:quality-priority-05
