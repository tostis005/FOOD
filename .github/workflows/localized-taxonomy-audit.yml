name: Audit Pometum localized taxonomy URLs

on:
  push:
    branches: [main]
    paths:
      - 'inc/language-slugs.php'
      - 'inc/language-seo.php'
      - 'inc/language-routing.php'
      - 'assets/css/pometum-v5-mobile-centering.css'
      - 'archive.php'
      - 'template-parts/card.php'
      - '.github/workflows/localized-taxonomy-audit.yml'
  workflow_dispatch:

jobs:
  audit-localized-taxonomies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP
        run: |
          set -euo pipefail
          php -l inc/language-slugs.php
          php -l inc/language-seo.php
          php -l inc/language-routing.php
          php -l archive.php
          php -l template-parts/card.php

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_audit_key
          chmod 600 ~/.ssh/food_audit_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Discover live URL and warm rewrites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SITE_URL="$(ssh -i ~/.ssh/food_audit_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            exit 1
          fi
          for CID in $(docker ps -q); do
            ROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then
                  echo "$p"
                  exit 0
                fi
              done
            ' 2>/dev/null || true)"
            if [ -n "$ROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              docker exec "$CID" php -r "require '$ROOT/wp-load.php'; echo home_url('/');"
              exit 0
            fi
          done
          exit 1
          REMOTE
          )"
          test -n "$SITE_URL"
          echo "::add-mask::$SITE_URL"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          curl -fsSL "$SITE_URL/" >/dev/null

      - name: Verify localized routes and redirects
        run: |
          set -euo pipefail
          path_of() { TARGET="$1" python -c 'import os,urllib.parse; print(urllib.parse.urlparse(os.environ["TARGET"]).path)'; }

          status_es=$(curl -LsS -o /tmp/es.html -w '%{http_code}' "$SITE_URL/alimentos/carnes/")
          status_en=$(curl -LsS -o /tmp/en.html -w '%{http_code}' "$SITE_URL/en/foods/meat/")
          status_topic_en=$(curl -LsS -o /tmp/topic-en.html -w '%{http_code}' "$SITE_URL/en/topics/food-safety/")
          effective_es=$(curl -LsS -o /dev/null -w '%{url_effective}' "$SITE_URL/alimentos/carnes/")
          effective_en=$(curl -LsS -o /dev/null -w '%{url_effective}' "$SITE_URL/en/foods/meat/")
          effective_topic_en=$(curl -LsS -o /dev/null -w '%{url_effective}' "$SITE_URL/en/topics/food-safety/")
          path_es=$(path_of "$effective_es")
          path_en=$(path_of "$effective_en")
          path_topic_en=$(path_of "$effective_topic_en")
          echo "Spanish meat: $status_es $path_es"
          echo "English meat: $status_en $path_en"
          echo "English food safety: $status_topic_en $path_topic_en"
          test "$status_es" = "200" || { echo 'FAIL: Spanish category route'; exit 1; }
          test "$status_en" = "200" || { echo 'FAIL: English food route'; exit 1; }
          test "$status_topic_en" = "200" || { echo 'FAIL: English topic route'; exit 1; }
          test "$path_es" = "/alimentos/carnes/" || { echo 'FAIL: Spanish canonical path'; exit 1; }
          test "$path_en" = "/en/foods/meat/" || { echo 'FAIL: English food canonical path'; exit 1; }
          test "$path_topic_en" = "/en/topics/food-safety/" || { echo 'FAIL: English topic canonical path'; exit 1; }
          grep -qi 'Carnes' /tmp/es.html || { echo 'FAIL: Spanish category label'; exit 1; }
          grep -qi 'Meat' /tmp/en.html || { echo 'FAIL: English category label'; exit 1; }
          grep -qi 'Food safety' /tmp/topic-en.html || { echo 'FAIL: English topic label'; exit 1; }
          if grep -q '/en/alimentos/' /tmp/en.html; then echo 'FAIL: Spanish food path leaked into English HTML'; exit 1; fi
          if grep -q '/en/tema/' /tmp/en.html; then echo 'FAIL: Spanish topic path leaked into English HTML'; exit 1; fi
          grep -q '/en/foods/' /tmp/en.html || { echo 'FAIL: no English food links'; exit 1; }
          grep -q '/en/topics/' /tmp/topic-en.html || { echo 'FAIL: no English topic links'; exit 1; }

          legacy_food_final=$(curl -LsS -o /dev/null -w '%{url_effective}' "$SITE_URL/en/alimentos/carnes/")
          legacy_topic_final=$(curl -LsS -o /dev/null -w '%{url_effective}' "$SITE_URL/en/tema/seguridad-alimentaria/")
          legacy_food_count=$(curl -LsS -o /dev/null -w '%{num_redirects}' "$SITE_URL/en/alimentos/carnes/")
          legacy_topic_count=$(curl -LsS -o /dev/null -w '%{num_redirects}' "$SITE_URL/en/tema/seguridad-alimentaria/")
          legacy_food_path=$(path_of "$legacy_food_final")
          legacy_topic_path=$(path_of "$legacy_topic_final")
          echo "Legacy food redirects: $legacy_food_count -> $legacy_food_path"
          echo "Legacy topic redirects: $legacy_topic_count -> $legacy_topic_path"
          test "$legacy_food_count" -ge 1 || { echo 'FAIL: legacy food did not redirect'; exit 1; }
          test "$legacy_food_path" = "/en/foods/meat/" || { echo 'FAIL: legacy food target'; exit 1; }
          test "$legacy_topic_count" -ge 1 || { echo 'FAIL: legacy topic did not redirect'; exit 1; }
          test "$legacy_topic_path" = "/en/topics/food-safety/" || { echo 'FAIL: legacy topic target'; exit 1; }

      - name: Install browser audit dependency
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Audit archive card layout
        run: |
          mkdir -p taxonomy-audit
          cat > taxonomy-audit.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox'] });
          const cases = [
            {name:'es-meat-desktop', path:'/alimentos/carnes/', width:1440, height:1000},
            {name:'en-meat-desktop', path:'/en/foods/meat/', width:1440, height:1000},
            {name:'es-meat-mobile', path:'/alimentos/carnes/', width:390, height:844},
            {name:'en-meat-mobile', path:'/en/foods/meat/', width:390, height:844}
          ];
          const report = [];
          for (const item of cases) {
            const context = await browser.newContext({viewport:{width:item.width,height:item.height}});
            const page = await context.newPage();
            const response = await page.goto(process.env.SITE_URL.replace(/\/$/, '') + item.path, {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(1200);
            const metrics = await page.evaluate(() => {
              const wrap = document.querySelector('.archive-wrap');
              const grid = document.querySelector('.archive-wrap > .card-grid');
              const cards = [...document.querySelectorAll('.archive-wrap > .card-grid .post-card')];
              const r = wrap?.getBoundingClientRect();
              const gr = grid?.getBoundingClientRect();
              return {
                viewport: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                archiveLeft: r ? Math.round(r.left) : null,
                archiveRight: r ? Math.round(innerWidth-r.right) : null,
                gridLeft: gr ? Math.round(gr.left) : null,
                gridRight: gr ? Math.round(innerWidth-gr.right) : null,
                cards: cards.length,
                firstCardBodyPadding: cards[0] ? getComputedStyle(cards[0].querySelector('.card-body')).padding : null
              };
            });
            if (!response || response.status() !== 200) throw new Error(`${item.path} returned ${response?.status()}`);
            if (metrics.scrollWidth > metrics.viewport + 1) throw new Error(`${item.name} horizontal overflow`);
            if (metrics.archiveLeft !== null && metrics.archiveLeft < 13) throw new Error(`${item.name} archive gutter too small: ${metrics.archiveLeft}`);
            if (metrics.gridLeft !== null && metrics.gridLeft < 13) throw new Error(`${item.name} grid gutter too small: ${metrics.gridLeft}`);
            await page.screenshot({path:`taxonomy-audit/${item.name}.png`, fullPage:true});
            report.push({name:item.name, ...metrics});
            await context.close();
          }
          fs.writeFileSync('taxonomy-audit/report.json', JSON.stringify(report, null, 2));
          await browser.close();
          NODE
          node taxonomy-audit.mjs
          cat taxonomy-audit/report.json

      - name: Upload taxonomy audit
        uses: actions/upload-artifact@v4
        with:
          name: pometum-localized-taxonomy-audit
          path: taxonomy-audit
          retention-days: 7
