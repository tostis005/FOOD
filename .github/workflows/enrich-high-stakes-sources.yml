name: Enrich high-stakes article sources

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/HIGH-STAKES-SOURCE-MAP.json'
      - 'content/tools/enrich-high-stakes-sources.py'
      - '.github/workflows/enrich-high-stakes-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add vetted authoritative sources
        run: python3 content/tools/enrich-high-stakes-sources.py
      - name: Commit enriched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/articles/es content/articles/en; then
            echo "High-stakes sources already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en
          git commit -m "Enrich high-stakes article sources"
          git push origin HEAD:main
