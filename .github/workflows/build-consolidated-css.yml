name: Build consolidated CSS

on:
  push:
    branches:
      - main
    paths:
      - 'assets/css/**'
      - '!assets/css/quinnoa.css'
      - '!assets/css/quinnoa-ui.css'
      - '.github/workflows/build-consolidated-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build safe runtime UI bundle
        shell: bash
        run: |
          set -euo pipefail
          output='assets/css/quinnoa-ui.css'
          sources=(
            'assets/css/food-v4.css'
            'assets/css/food-v5.css'
            'assets/css/food-v6.css'
            'assets/css/food-v6-icons.css'
            'assets/css/pommelo-v1.css'
            'assets/css/pommelo-v2.css'
            'assets/css/pommelo-v3.css'
            'assets/css/pommelo-v4.css'
            'assets/css/pommelo-v5-icons.css'
            'assets/css/pommelo-v6-artwork.css'
            'assets/css/pommelo-v6-optical-tune.css'
            'assets/css/pometum-v1.css'
            'assets/css/pometum-v2.css'
            'assets/css/pometum-v3.css'
            'assets/css/pometum-v4.css'
            'assets/css/pometum-v5-mobile-centering.css'
            'assets/css/pometum-v6-ui.css'
            'assets/css/pometum-v7-polish.css'
          )

          : > "$output"
          printf '/* Quinnoa runtime UI bundle. Generated automatically; edit source fragments, not this file. */\n\n' >> "$output"
          for source in "${sources[@]}"; do
            if [[ ! -f "$source" ]]; then
              echo "Missing CSS source: $source" >&2
              exit 1
            fi
            printf '\n/* ===== %s ===== */\n' "$source" >> "$output"
            cat "$source" >> "$output"
            printf '\n' >> "$output"
          done

      - name: Commit generated stylesheet
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- assets/css/quinnoa-ui.css)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/quinnoa-ui.css
          git commit -m 'Build Quinnoa runtime UI bundle'
          git push
