name: Expand short English articles

on:
  push:
    branches:
      - content/final-clean-pass-v2
    paths:
      - 'content/tools/expand-short-en.py'
      - '.github/workflows/expand-short-en.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/final-clean-pass-v2

      - name: Expand short English articles
        run: python3 content/tools/expand-short-en.py

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('content/articles').glob('*/*.json'))
          assert len(paths) == 50
          for p in paths:
              json.loads(p.read_text(encoding='utf-8'))
          print('VALIDATED_ARTICLES=50')
          PY

      - name: Commit expanded English articles
        run: |
          if git diff --quiet -- content/articles/en; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/en
          git commit -m 'Expand short English articles to standalone depth'
          git push origin HEAD:content/final-clean-pass-v2
