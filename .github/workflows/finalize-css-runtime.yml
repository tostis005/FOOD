name: Finalize CSS runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-css-runtime.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final CSS runtime
        run: python3 scripts/finalize_css_runtime.py

      - name: Validate PHP
        run: |
          php -l functions.php
          php -l header.php
          php -l single.php

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions.php header.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.php header.php
          git commit -m 'Finalize consolidated CSS loading'
          git push
