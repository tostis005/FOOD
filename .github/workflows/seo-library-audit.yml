name: Audit SEO library

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/es/**.json'
      - 'content/articles/en/**.json'
      - 'content/articles/taxonomies.json'
      - 'content/articles/SEO-CONSOLIDATIONS.json'
      - 'content/articles/SEO-CANNIBALIZATION-ALLOWLIST.json'
      - 'content/tools/audit-seo-library.py'
      - '.github/workflows/seo-library-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quinnoa-seo-library-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit SEO and content inventory
        run: |
          set -euo pipefail
          python3 content/tools/audit-seo-library.py
          cat content/audits/SEO-LIBRARY-AUDIT.md

      - name: Upload detailed audit
        uses: actions/upload-artifact@v4
        with:
          name: seo-library-audit
          path: |
            content/audits/SEO-LIBRARY-AUDIT.json
            content/audits/SEO-LIBRARY-AUDIT.md
          retention-days: 14

      - name: Commit current audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain -- content/audits/SEO-LIBRARY-AUDIT.json content/audits/SEO-LIBRARY-AUDIT.md)" ]; then
              echo "SEO library audit is already current."
              exit 0
            fi

            git add content/audits/SEO-LIBRARY-AUDIT.json content/audits/SEO-LIBRARY-AUDIT.md
            git commit -m "Update SEO library audit"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced while publishing the audit; recalculating on latest HEAD (attempt $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            python3 content/tools/audit-seo-library.py
          done

          echo "ERROR: Could not publish the SEO library audit after 3 attempts." >&2
          exit 1
