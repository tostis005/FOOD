name: Audit Pometum bilingual UI

on:
  push:
    branches:
      - main
    paths:
      - 'inc/language-routing.php'
      - 'header.php'
      - 'front-page.php'
      - 'footer.php'
      - 'single.php'
      - 'archive.php'
      - 'searchform.php'
      - 'template-parts/card.php'
      - 'assets/css/pometum-v2.css'
      - 'assets/css/pometum-v4.css'
      - 'assets/js/pometum-language-overlay.js'
      - '.github/workflows/bilingual-audit.yml'
  workflow_dispatch:

jobs:
  audit-bilingual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_audit_key
          chmod 600 ~/.ssh/food_audit_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Discover live WordPress URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SITE_URL="$(ssh -i ~/.ssh/food_audit_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for CID in $(docker ps -q); do
            ROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then echo "$p"; exit 0; fi
              done
            ' 2>/dev/null || true)"
            if [ -n "$ROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              docker exec "$CID" php -r "require '$ROOT/wp-load.php'; echo home_url('/');"
              exit 0
            fi
          done
          exit 1
          REMOTE
          )"
          test -n "$SITE_URL"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Install browser dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Audit ES and EN experiences
        run: |
          set -euo pipefail
          mkdir -p bilingual-audit-output
          cat > bilingual-audit.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
          const base = new URL(process.env.SITE_URL);
          const routes = {
            esHome: new URL('/', base).href,
            enHome: new URL('/en/', base).href,
            esArticle: new URL('/alimentos-con-mas-proteina/', base).href,
            enArticle: new URL('/en/highest-protein-foods/', base).href,
            enCategory: new URL('/en/alimentos/carnes/', base).href
          };
          const report = {};

          async function audit(url, name, width = 1440, height = 1000, testLanguageOverlay = false) {
            const context = await browser.newContext({ viewport: { width, height } });
            const page = await context.newPage();
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(1200);
            const data = await page.evaluate(() => ({
              lang: document.documentElement.lang,
              title: document.title,
              scrollWidth: document.documentElement.scrollWidth,
              viewport: window.innerWidth,
              cards: [...document.querySelectorAll('.post-card > a')].map(a => a.pathname),
              hasLanguageToggle: !!document.querySelector('.language-toggle'),
              flagOnly: !!document.querySelector('.language-toggle .language-current-flag') && !document.querySelector('.language-toggle').textContent.trim().match(/\b(?:ES|EN)\b/)
            }));
            data.status = response?.status() ?? 0;
            data.overflow = Math.max(0, data.scrollWidth - data.viewport);

            await page.screenshot({ path: `bilingual-audit-output/${name}-${width}.png`, fullPage: true });

            if (testLanguageOverlay) {
              await page.click('.language-toggle');
              await page.waitForSelector('.language-overlay.is-open', { state: 'visible', timeout: 5000 });
              data.languageOverlay = await page.evaluate(() => ({
                open: document.querySelector('.language-overlay')?.classList.contains('is-open') || false,
                ariaHidden: document.querySelector('.language-overlay')?.getAttribute('aria-hidden'),
                labels: [...document.querySelectorAll('.language-option-name')].map(el => el.textContent.trim()),
                hrefs: [...document.querySelectorAll('.language-option')].map(el => new URL(el.href).pathname),
                current: document.querySelectorAll('.language-option[aria-current="page"]').length,
                bodyLocked: document.body.classList.contains('language-overlay-open')
              }));
              await page.screenshot({ path: `bilingual-audit-output/${name}-language-${width}.png`, fullPage: true });
              await page.click('.language-overlay-close');
              await page.waitForSelector('.language-overlay.is-open', { state: 'detached', timeout: 5000 }).catch(() => {});
            }

            report[name] = data;
            await context.close();
            return data;
          }

          const es = await audit(routes.esHome, 'home-es', 1440, 1000, true);
          const en = await audit(routes.enHome, 'home-en', 1440, 1000, true);
          const esArticle = await audit(routes.esArticle, 'article-es');
          const enArticle = await audit(routes.enArticle, 'article-en');
          const enCategory = await audit(routes.enCategory, 'category-en');
          await audit(routes.esHome, 'home-es-mobile', 390, 844, true);
          await audit(routes.enHome, 'home-en-mobile', 390, 844, true);

          for (const [name, data] of Object.entries(report)) {
            if (data.status >= 400) throw new Error(`${name} returned ${data.status}`);
            if (data.overflow > 0) throw new Error(`${name} has ${data.overflow}px horizontal overflow`);
            if (!data.hasLanguageToggle) throw new Error(`${name} has no language flag control`);
            if (!data.flagOnly) throw new Error(`${name} language control is not flag-only`);
            if (data.languageOverlay) {
              if (!data.languageOverlay.open || data.languageOverlay.ariaHidden !== 'false') throw new Error(`${name} language overlay did not open correctly`);
              if (!data.languageOverlay.labels.includes('Español') || !data.languageOverlay.labels.includes('English')) throw new Error(`${name} language overlay is missing an edition`);
              if (data.languageOverlay.current !== 1) throw new Error(`${name} should have exactly one current language`);
              if (!data.languageOverlay.bodyLocked) throw new Error(`${name} did not lock body scroll while language overlay was open`);
            }
          }
          if (!es.lang.toLowerCase().startsWith('es')) throw new Error(`Spanish home lang is ${es.lang}`);
          if (!en.lang.toLowerCase().startsWith('en')) throw new Error(`English home lang is ${en.lang}`);
          if (es.cards.some(path => path.startsWith('/en/'))) throw new Error('Spanish home contains English article cards');
          if (en.cards.length && en.cards.some(path => !path.startsWith('/en/'))) throw new Error('English home contains non-English article cards');
          if (!enArticle.lang.toLowerCase().startsWith('en')) throw new Error('English article is not marked English');
          if (!esArticle.lang.toLowerCase().startsWith('es')) throw new Error('Spanish article is not marked Spanish');
          if (!enCategory.lang.toLowerCase().startsWith('en')) throw new Error('English category is not marked English');

          fs.writeFileSync('bilingual-audit-output/report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          NODE
          node bilingual-audit.mjs

      - name: Upload bilingual audit
        uses: actions/upload-artifact@v4
        with:
          name: pometum-bilingual-audit
          path: bilingual-audit-output/
          retention-days: 7
