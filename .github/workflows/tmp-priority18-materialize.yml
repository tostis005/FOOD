name: Temporary priority 18 materialize

on:
  push:
    branches:
      - tmp-quality-priority-18-materialize

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify editorial delta
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/p18delta.* > /tmp/p18delta.b64
          base64 -d /tmp/p18delta.b64 > /tmp/p18delta.json.gz
          actual="$(sha256sum /tmp/p18delta.json.gz | awk '{print $1}')"
          expected="8184852832b6e6a94ae4a4eb085537255ac647ec68a039c61c910d4d29f6d1f1"
          test "$actual" = "$expected"
          python - <<'PY'
          import gzip, pathlib
          raw = gzip.decompress(pathlib.Path('/tmp/p18delta.json.gz').read_bytes())
          pathlib.Path('/tmp/p18delta.json').write_bytes(raw)
          print('DELTA_BYTES', len(raw))
          PY

      - name: Require final branch aligned with live main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main quality-priority-18
          main_sha="$(git rev-parse origin/main)"
          final_sha="$(git rev-parse origin/quality-priority-18)"
          echo "MAIN=$main_sha"
          echo "FINAL=$final_sha"
          test "$main_sha" = "$final_sha"
          rm -rf /tmp/q18
          git worktree add /tmp/q18 origin/main
          git -C /tmp/q18 checkout -B quality-priority-18 origin/quality-priority-18

      - name: Apply delta and focused validation
        shell: python
        run: |
          import hashlib, html, json, math, pathlib, re, subprocess, sys

          root = pathlib.Path('/tmp/q18')
          payload = json.loads(pathlib.Path('/tmp/p18delta.json').read_text(encoding='utf-8'))
          expected_ids = [509,563,705,393,351,442,702,709,366,129,523,141,467,825,228,420,708,491,715,548]
          expected_paths = {entry['path'] for entry in payload['files']}
          if payload.get('ids') != expected_ids or len(payload.get('files', [])) != 40 or len(expected_paths) != 40:
              raise SystemExit('Unexpected payload scope')

          for entry in payload['files']:
              p = root / entry['path']
              if not p.is_file():
                  raise SystemExit(f'Missing live-main file: {entry["path"]}')
              data = json.loads(p.read_text(encoding='utf-8'))
              current = data.get('content_html', '').rstrip()
              actual = hashlib.sha256(current.encode('utf-8')).hexdigest()
              if actual != entry['source_content_sha256']:
                  raise SystemExit(f'Live-main body changed since export: {entry["path"]}: {actual}')
              if int(data.get('article_number')) != int(entry['article_number']):
                  raise SystemExit(f'Article number mismatch before apply: {entry["path"]}')
              if data.get('language') != entry['language']:
                  raise SystemExit(f'Language mismatch before apply: {entry["path"]}')
              data['content_html'] = current + entry['append']
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          forbidden = {
              'es': [
                  'merece un artículo','merece otro artículo','otro artículo','en este artículo','hemos elegido','hemos usado','hemos utilizado','deliberadamente','se excluye deliberadamente','excluimos deliberadamente','para no manipular','criterio de ordenación','fuentes y criterio','registro utilizado','registros concretos','la tabla no pretende','no pretendemos','cocinado con calor seco','tabla principal','ranking principal','tabla anterior','ranking anterior','la tabla de arriba','el ranking de arriba','como vimos','como hemos visto','en otra guía','en otra entrada','en otro post','en otra página'
              ],
              'en': [
                  'deserves its own article','another article','in this article','we chose','we have chosen','we used','we have used','deliberately','to avoid manipulating','ordering criteria','sources and methodology','record used','specific records','the table is not intended','cooked by dry heat','main table','main ranking','previous table','previous ranking','the table above','the ranking above','as we saw','as we have seen','in another guide','in another article','in another post','on another page'
              ]
          }

          tag_re = re.compile(r'<[^>]+>')
          word_re = re.compile(r"[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)?")
          p_re = re.compile(r'<p\b[^>]*>(.*?)</p>', re.I | re.S)
          h2_re = re.compile(r'<h2\b[^>]*>', re.I)

          def plain(s):
              s = html.unescape(tag_re.sub(' ', s or ''))
              return re.sub(r'\s+', ' ', s).strip()

          def words(s):
              return word_re.findall(plain(s))

          docs = {}
          errors = []
          groups = {}
          for entry in payload['files']:
              path = entry['path']
              data = json.loads((root/path).read_text(encoding='utf-8'))
              lang = 'es' if '/es/' in path else 'en'
              aid = int(entry['article_number'])
              docs[(lang, aid)] = (path, data)
              if int(data.get('article_number', -1)) != aid:
                  errors.append(f'{path}: article_number')
              if data.get('language') != lang:
                  errors.append(f'{path}: language')
              if data.get('status') != 'publish':
                  errors.append(f'{path}: status')
              tg = data.get('translation_group')
              if not isinstance(tg, str) or not tg.strip():
                  errors.append(f'{path}: translation_group empty')
              groups.setdefault(aid, {})[lang] = tg
              body = data.get('content_html', '')
              wc = len(words(body))
              mins = math.ceil(wc / 210)
              h2 = len(h2_re.findall(body))
              if wc < 700:
                  errors.append(f'{path}: words={wc}')
              if mins < 4:
                  errors.append(f'{path}: reading={mins}')
              if h2 >= 5 and wc / h2 < 80:
                  errors.append(f'{path}: words_per_h2={wc/h2:.2f}')
              lower = plain(body).casefold()
              for phrase in forbidden[lang]:
                  if phrase.casefold() in lower:
                      errors.append(f'{path}: forbidden={phrase}')
              excerpt = plain(data.get('excerpt', '')).casefold()
              if excerpt and excerpt in lower:
                  errors.append(f'{path}: excerpt repeated')

          for aid in expected_ids:
              pair = groups.get(aid, {})
              if set(pair) != {'es','en'} or pair['es'] != pair['en'] or not pair['es']:
                  errors.append(f'{aid}: translation group pair mismatch')

          # Exact long-paragraph duplicates (>=70 words) across distinct article IDs in same language.
          for lang in ('es','en'):
              seen = {}
              for (dl, aid), (path, data) in docs.items():
                  if dl != lang:
                      continue
                  for ptxt in p_re.findall(data.get('content_html','')):
                      norm = re.sub(r'\s+', ' ', plain(ptxt).casefold()).strip()
                      if len(word_re.findall(norm)) < 70:
                          continue
                      prev = seen.get(norm)
                      if prev is not None and prev[0] != aid:
                          errors.append(f'long paragraph duplicate {lang}: {prev[0]} vs {aid}')
                      else:
                          seen[norm] = (aid, path)

          # Exact 12-word shingles across distinct IDs in same language.
          for lang in ('es','en'):
              seen = {}
              for (dl, aid), (path, data) in docs.items():
                  if dl != lang:
                      continue
                  toks = [w.casefold() for w in words(data.get('content_html',''))]
                  local = set(tuple(toks[i:i+12]) for i in range(max(0, len(toks)-11)))
                  for sh in local:
                      prev = seen.get(sh)
                      if prev is not None and prev != aid:
                          errors.append(f'12-word duplicate {lang}: {prev} vs {aid}: {" ".join(sh)}')
                          break
                      seen[sh] = aid

          if errors:
              print('\n'.join(errors[:100]))
              raise SystemExit(f'Focused validation failed: {len(errors)} errors')

          changed = subprocess.check_output(['git','-C',str(root),'diff','--name-only','origin/main'], text=True).splitlines()
          if set(changed) != expected_paths or len(changed) != 40:
              print('EXPECTED', sorted(expected_paths))
              print('CHANGED', changed)
              raise SystemExit('Diff scope mismatch')

          metrics = []
          for (lang, aid), (path, data) in sorted(docs.items(), key=lambda x:(x[0][1],x[0][0])):
              wc = len(words(data.get('content_html','')))
              h2 = len(h2_re.findall(data.get('content_html','')))
              metrics.append((wc, wc/h2 if h2 else wc, lang, aid))
          print('VALIDATED_VERSIONS', len(docs))
          print('MIN_WORDS', min(x[0] for x in metrics))
          print('MAX_WORDS', max(x[0] for x in metrics))
          print('MIN_WORDS_PER_H2', min(x[1] for x in metrics))
          print('ERRORS', len(errors))

      - name: Commit and push final branch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/q18
          git config user.name "tostis005"
          git config user.email "tostis005@gmail.com"
          git add -- content/articles/es content/articles/en
          test "$(git diff --cached --name-only | wc -l)" -eq 40
          git commit -m "Improve editorial quality for priority block 18"
          test "$(git rev-list --count origin/main..HEAD)" -eq 1
          git push origin HEAD:quality-priority-18
