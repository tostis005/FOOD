name: Restore CSS runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-css-runtime.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-consolidation CSS loading
        run: python3 scripts/restore_css_runtime.py

      - name: Validate PHP
        run: |
          php -l functions.php
          php -l header.php
          php -l single.php

      - name: Commit restoration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions.php header.php single.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.php header.php single.php
          git commit -m 'Restore category artwork CSS loading'
          git push
