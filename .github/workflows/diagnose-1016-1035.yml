name: Snapshot 1016-1035 for validation

on:
  push:
    branches:
      - new-content-1016-1035

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect target block
        run: |
          mkdir -p snapshot/content/articles/es snapshot/content/articles/en snapshot/content/tools
          for lang in es en; do
            for n in $(seq 1016 1035); do
              f=$(find "content/articles/$lang" -maxdepth 1 -type f -name "$n-*.json" -print -quit)
              test -n "$f"
              cp "$f" "snapshot/content/articles/$lang/"
            done
          done
          cp content/tools/audit-article-editorial.py snapshot/content/tools/
      - name: Upload target block
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-1016-1035
          path: snapshot
