name: Temp fix 1053-1075

on:
  push:
    branches:
      - tmp-audit-1053-1075

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand only short target versions
        run: python3 content/tools/temp_raise_1053_1075.py
      - name: Run strict editorial audit
        run: python3 content/tools/audit-article-editorial.py content/articles --strict-quality
      - name: Commit article corrections
        shell: bash
        run: |
          if git diff --quiet -- content/articles; then
            echo "No article changes required"
            exit 0
          fi
          git config user.name "tostis005"
          git config user.email "tostis005@gmail.com"
          git add content/articles/es content/articles/en
          git commit -m "Raise remaining articles to editorial floor"
          git push origin HEAD:tmp-audit-1053-1075
