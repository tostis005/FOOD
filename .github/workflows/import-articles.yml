name: Import FOOD JSON articles

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/es/*.json'
      - 'content/articles/en/*.json'
      - 'content/tools/import-articles.php'
      - '.github/workflows/import-articles.yml'
  workflow_dispatch:
    inputs:
      language:
        description: 'Language to import'
        required: true
        type: choice
        options:
          - es
          - en
          - all
        default: es
      from:
        description: 'First article number'
        required: true
        default: '1'
      to:
        description: 'Last article number'
        required: true
        default: '999999'
      status:
        description: 'WordPress status override'
        required: true
        type: choice
        options:
          - publish
          - draft
          - json
        default: publish
      force:
        description: 'Force rewrite even when the JSON hash is unchanged'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: food-json-article-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      IMPORT_LANGUAGE: ${{ inputs.language || 'all' }}
      IMPORT_FROM: ${{ inputs.from || '1' }}
      IMPORT_TO: ${{ inputs.to || '999999' }}
      IMPORT_STATUS: ${{ inputs.status || 'publish' }}
      IMPORT_FORCE: ${{ inputs.force || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate importer syntax
        run: php -l content/tools/import-articles.php

      - name: Validate article JSON files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = {
              'schema_version', 'id', 'article_number', 'translation_group',
              'language', 'title', 'slug', 'seo', 'excerpt', 'taxonomy',
              'content_html', 'faq', 'sources', 'image', 'status'
          }
          count = 0
          for path in sorted(Path('content/articles').glob('*/*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              missing = required - data.keys()
              if missing:
                  raise SystemExit(f'{path}: missing {sorted(missing)}')
              count += 1
          if not count:
              raise SystemExit('No article JSON files found')
          print(f'Validated {count} article JSON files')
          PY

      - name: Normalize canonical article fields
        id: normalize_sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source_block = re.compile(
              r'<h2>\s*(?:Fuentes|Sources)\s*</h2>\s*<p>.*?</p>\s*$',
              re.IGNORECASE | re.DOTALL,
          )
          html_tag = re.compile(r'</?[A-Za-z][^>]*>')

          # Articles 776-783 were imported once with inline HTML in excerpt.
          # Strip only that known legacy range; validation below rejects HTML elsewhere.
          legacy_excerpt_numbers = set(range(776, 784))

          changed = 0
          excerpt_changed = 0
          source_changed = 0
          for path in sorted(Path('content/articles').glob('*/*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              dirty = False

              content = data.get('content_html', '')
              normalized_content = source_block.sub('', content).strip()
              if normalized_content != content:
                  data['content_html'] = normalized_content
                  source_changed += 1
                  dirty = True

              number = int(data.get('article_number', 0) or 0)
              excerpt = data.get('excerpt', '')
              if number in legacy_excerpt_numbers and isinstance(excerpt, str):
                  normalized_excerpt = html_tag.sub('', excerpt).strip()
                  if normalized_excerpt != excerpt:
                      data['excerpt'] = normalized_excerpt
                      excerpt_changed += 1
                      dirty = True

              if not dirty:
                  continue

              path.write_text(
                  json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
                  encoding='utf-8',
              )
              changed += 1

          print(
              f'Normalized {changed} article JSON files '
              f'({source_changed} source sections, {excerpt_changed} excerpts)'
          )
          PY

          if git diff --quiet -- content/articles/es content/articles/en; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate plain-text excerpts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html_tag = re.compile(r'</?[A-Za-z][^>]*>')
          failures = []

          for path in sorted(Path('content/articles').glob('*/*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              excerpt = data.get('excerpt', '')
              if not isinstance(excerpt, str):
                  failures.append(f'{path}: excerpt must be a string')
                  continue
              if html_tag.search(excerpt):
                  failures.append(f'{path}: excerpt contains HTML')

          if failures:
              raise SystemExit('\n'.join(failures))

          print('Validated plain-text excerpts')
          PY

      - name: Persist normalized JSON
        if: steps.normalize_sources.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles/es content/articles/en
          git commit -m 'Normalize article fields [skip ci]'
          git push origin HEAD:main

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_import_key
          chmod 600 ~/.ssh/food_import_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Detect WordPress installation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          WP_CONFIGS="$(
            ssh -i ~/.ssh/food_import_key "$VPS_USER@$VPS_HOST" '
              for base in /var/www /home /srv/www /usr/share/nginx/html; do
                if [ -d "$base" ]; then
                  find "$base" -maxdepth 7 -type f -name wp-config.php 2>/dev/null
                fi
              done
            ' | sort -u
          )"

          COUNT="$(printf '%s\n' "$WP_CONFIGS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ -z "$WP_CONFIGS" ] || [ "$COUNT" -ne 1 ]; then
            echo "ERROR: No se ha podido identificar una única instalación de WordPress."
            printf '%s\n' "$WP_CONFIGS"
            exit 1
          fi

          WP_ROOT="${WP_CONFIGS%/wp-config.php}"
          echo "WP_ROOT=$WP_ROOT" >> "$GITHUB_ENV"
          echo "WordPress detectado en $WP_ROOT"

      - name: Copy importer to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/food_import_key \
            content/tools/import-articles.php \
            "$VPS_USER@$VPS_HOST:/tmp/food-import-articles.php"

      - name: Read last successful import SHA
        id: import_state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          STATE_OUTPUT="$(
            ssh -i ~/.ssh/food_import_key "$VPS_USER@$VPS_HOST" \
              "WP_ROOT='$WP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail

          if command -v php >/dev/null 2>&1; then
            php /tmp/food-import-articles.php "$WP_ROOT" /tmp --state=read
            exit 0
          fi

          if ! command -v docker >/dev/null 2>&1 || ! docker ps >/dev/null 2>&1; then
            echo "ERROR: No hay PHP utilizable para leer el estado del importador." >&2
            exit 1
          fi

          CANDIDATES=""
          while read -r CID; do
            [ -z "$CID" ] && continue
            CROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then
                  echo "$p"
                  exit 0
                fi
              done
              FOUND="$(find /var/www /app -maxdepth 5 -type f -name wp-load.php 2>/dev/null | head -n 1)"
              [ -n "$FOUND" ] && dirname "$FOUND"
            ' 2>/dev/null || true)"

            if [ -n "$CROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              CANDIDATES="${CANDIDATES}${CID}|${CROOT}\n"
            fi
          done < <(docker ps -q)

          CANDIDATE_COUNT="$(printf '%b' "$CANDIDATES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$CANDIDATE_COUNT" -ne 1 ]; then
            echo "ERROR: Se esperaba 1 contenedor WordPress con PHP y se han encontrado $CANDIDATE_COUNT." >&2
            printf '%b' "$CANDIDATES" >&2
            exit 1
          fi

          CANDIDATE="$(printf '%b' "$CANDIDATES" | sed '/^$/d' | head -n 1)"
          CONTAINER_ID="${CANDIDATE%%|*}"
          CONTAINER_WP_ROOT="${CANDIDATE#*|}"

          docker cp /tmp/food-import-articles.php "$CONTAINER_ID:/tmp/food-import-articles.php"
          docker exec "$CONTAINER_ID" \
            php /tmp/food-import-articles.php \
              "$CONTAINER_WP_ROOT" /tmp --state=read
          REMOTE
          )"

          printf '%s\n' "$STATE_OUTPUT"
          LAST_SHA="$(printf '%s\n' "$STATE_OUTPUT" | sed -n 's/^IMPORT_STATE_SHA=//p' | tail -n 1 | tr -d '\r\n')"
          echo "sha=$LAST_SHA" >> "$GITHUB_OUTPUT"

      - name: Select and package articles for import
        id: select_articles
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          LAST_SUCCESSFUL_SHA: ${{ steps.import_state.outputs.sha }}
        run: |
          set -euo pipefail

          TARGET_SHA="$(git rev-parse HEAD)"
          BASE_SHA=""
          rm -rf /tmp/food-package
          mkdir -p /tmp/food-package/content/articles/es /tmp/food-package/content/articles/en
          : > /tmp/food-selected-files.txt

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 - <<'PY' > /tmp/food-selected-files.txt
          import json
          import os
          from pathlib import Path

          language = os.environ['IMPORT_LANGUAGE']
          first = int(os.environ['IMPORT_FROM'])
          last = int(os.environ['IMPORT_TO'])
          languages = ('es', 'en') if language == 'all' else (language,)

          for lang in languages:
              for path in sorted(Path('content/articles', lang).glob('*.json')):
                  data = json.loads(path.read_text(encoding='utf-8'))
                  number = int(data.get('article_number', 0))
                  if first <= number <= last:
                      print(path.as_posix())
          PY
            SUCCESSFUL_SHA=""
            echo "Manual import: selected requested language/range; automatic SHA state will not advance."
          else
            candidate="$LAST_SUCCESSFUL_SHA"
            if [ -n "$candidate" ] \
              && git cat-file -e "${candidate}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$candidate" "$TARGET_SHA"; then
              BASE_SHA="$candidate"
              echo "Using last successful production SHA: $BASE_SHA"
            fi

            if [ -z "$BASE_SHA" ]; then
              candidate="$EVENT_BEFORE"
              if [ -n "$candidate" ] \
                && ! printf '%s' "$candidate" | grep -Eq '^0+$' \
                && git cat-file -e "${candidate}^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$candidate" "$TARGET_SHA"; then
                BASE_SHA="$candidate"
                echo "Bootstrapping import state from push base SHA: $BASE_SHA"
              fi
            fi

            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="$(git rev-parse "${TARGET_SHA}^" 2>/dev/null || true)"
              if [ -n "$BASE_SHA" ]; then
                echo "Falling back to target parent SHA: $BASE_SHA"
              fi
            fi

            if [ -n "$BASE_SHA" ]; then
              git diff --name-only --diff-filter=AMR "$BASE_SHA" "$TARGET_SHA" -- \
                ':(glob)content/articles/es/*.json' \
                ':(glob)content/articles/en/*.json' \
                | while IFS= read -r file; do
                    [ -f "$file" ] && printf '%s\n' "$file"
                  done \
                > /tmp/food-selected-files.txt

              DELETED="$(
                git diff --name-only --diff-filter=D "$BASE_SHA" "$TARGET_SHA" -- \
                  ':(glob)content/articles/es/*.json' \
                  ':(glob)content/articles/en/*.json' || true
              )"
              if [ -n "$DELETED" ]; then
                echo "WARNING: Deleted article JSON files are not removed from WordPress automatically:"
                printf '%s\n' "$DELETED"
              fi
            else
              git ls-tree -r --name-only "$TARGET_SHA" \
                | grep -E '^content/articles/(es|en)/[^/]+\.json$' \
                > /tmp/food-selected-files.txt || true
              echo "No usable base commit was found; selected the complete current article inventory."
            fi

            SUCCESSFUL_SHA="$TARGET_SHA"
          fi

          sort -u /tmp/food-selected-files.txt -o /tmp/food-selected-files.txt

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p "/tmp/food-package/$(dirname "$file")"
            cp "$file" "/tmp/food-package/$file"
          done < /tmp/food-selected-files.txt

          COUNT="$(sed '/^$/d' /tmp/food-selected-files.txt | wc -l | tr -d ' ')"
          echo "Selected $COUNT article JSON file(s) for this import."
          if [ "$COUNT" -gt 0 ]; then
            cat /tmp/food-selected-files.txt
          fi

          tar -C /tmp/food-package -czf /tmp/food-articles.tgz content/articles

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "successful_sha=$SUCCESSFUL_SHA" >> "$GITHUB_OUTPUT"

      - name: Copy selected article package to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/food_import_key \
            /tmp/food-articles.tgz \
            "$VPS_USER@$VPS_HOST:/tmp/food-articles.tgz"

      - name: Import articles into WordPress
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMPORT_SUCCESSFUL_SHA: ${{ steps.select_articles.outputs.successful_sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/food_import_key "$VPS_USER@$VPS_HOST" \
            "WP_ROOT='$WP_ROOT' IMPORT_LANGUAGE='$IMPORT_LANGUAGE' IMPORT_FROM='$IMPORT_FROM' IMPORT_TO='$IMPORT_TO' IMPORT_STATUS='$IMPORT_STATUS' IMPORT_FORCE='$IMPORT_FORCE' IMPORT_SUCCESSFUL_SHA='$IMPORT_SUCCESSFUL_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          rm -rf /tmp/food-article-import
          mkdir -p /tmp/food-article-import
          tar -xzf /tmp/food-articles.tgz -C /tmp/food-article-import
          ARTICLES_ROOT=/tmp/food-article-import/content/articles

          run_import() {
            php /tmp/food-import-articles.php \
              "$1" "$2" \
              "--language=$IMPORT_LANGUAGE" \
              "--from=$IMPORT_FROM" \
              "--to=$IMPORT_TO" \
              "--status=$IMPORT_STATUS" \
              "--force=$IMPORT_FORCE" \
              "--successful-sha=$IMPORT_SUCCESSFUL_SHA"
          }

          if command -v php >/dev/null 2>&1; then
            run_import "$WP_ROOT" "$ARTICLES_ROOT"
            exit 0
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "ERROR: No hay PHP en el host y tampoco está disponible Docker."
            exit 1
          fi

          if ! docker ps >/dev/null 2>&1; then
            echo "ERROR: Docker existe, pero VPS_USER no puede consultar los contenedores."
            exit 1
          fi

          CANDIDATES=""
          while read -r CID; do
            [ -z "$CID" ] && continue
            CROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then
                  echo "$p"
                  exit 0
                fi
              done
              FOUND="$(find /var/www /app -maxdepth 5 -type f -name wp-load.php 2>/dev/null | head -n 1)"
              [ -n "$FOUND" ] && dirname "$FOUND"
            ' 2>/dev/null || true)"

            if [ -n "$CROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              CANDIDATES="${CANDIDATES}${CID}|${CROOT}\n"
            fi
          done < <(docker ps -q)

          CANDIDATE_COUNT="$(printf '%b' "$CANDIDATES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$CANDIDATE_COUNT" -ne 1 ]; then
            echo "ERROR: Se esperaba 1 contenedor WordPress con PHP y se han encontrado $CANDIDATE_COUNT."
            printf '%b' "$CANDIDATES"
            exit 1
          fi

          CANDIDATE="$(printf '%b' "$CANDIDATES" | sed '/^$/d' | head -n 1)"
          CONTAINER_ID="${CANDIDATE%%|*}"
          CONTAINER_WP_ROOT="${CANDIDATE#*|}"

          docker cp /tmp/food-articles.tgz "$CONTAINER_ID:/tmp/food-articles.tgz"
          docker cp /tmp/food-import-articles.php "$CONTAINER_ID:/tmp/food-import-articles.php"
          docker exec "$CONTAINER_ID" sh -lc 'rm -rf /tmp/food-article-import && mkdir -p /tmp/food-article-import && tar -xzf /tmp/food-articles.tgz -C /tmp/food-article-import'
          docker exec \
            -e IMPORT_LANGUAGE="$IMPORT_LANGUAGE" \
            -e IMPORT_FROM="$IMPORT_FROM" \
            -e IMPORT_TO="$IMPORT_TO" \
            -e IMPORT_STATUS="$IMPORT_STATUS" \
            -e IMPORT_FORCE="$IMPORT_FORCE" \
            -e IMPORT_SUCCESSFUL_SHA="$IMPORT_SUCCESSFUL_SHA" \
            "$CONTAINER_ID" \
            php /tmp/food-import-articles.php \
              "$CONTAINER_WP_ROOT" /tmp/food-article-import/content/articles \
              "--language=$IMPORT_LANGUAGE" \
              "--from=$IMPORT_FROM" \
              "--to=$IMPORT_TO" \
              "--status=$IMPORT_STATUS" \
              "--force=$IMPORT_FORCE" \
              "--successful-sha=$IMPORT_SUCCESSFUL_SHA"
          REMOTE

      - name: Cleanup temporary files
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/food_import_key "$VPS_USER@$VPS_HOST" \
            "rm -rf /tmp/food-article-import /tmp/food-articles.tgz /tmp/food-import-articles.php" || true
