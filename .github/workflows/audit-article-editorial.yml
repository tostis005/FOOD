name: Audit article editorial quality

on:
  pull_request:
    paths:
      - 'content/articles/**'
      - 'content/tools/audit-article-editorial.py'
      - '.github/workflows/audit-article-editorial.yml'
  push:
    branches:
      - main
    paths:
      - 'content/articles/**'
      - 'content/tools/audit-article-editorial.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit final bilingual article set
        id: editorial_audit
        shell: bash
        run: |
          set +e
          python3 content/tools/audit-article-editorial.py content/articles > editorial-audit-report.txt 2>&1
          status=$?
          cat editorial-audit-report.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload editorial audit report
        uses: actions/upload-artifact@v4
        with:
          name: editorial-audit-report
          path: editorial-audit-report.txt
      - name: Fail when editorial audit reports issues
        if: steps.editorial_audit.outputs.status != '0'
        run: exit 1
