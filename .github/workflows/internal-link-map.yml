name: Rebuild internal link map

on:
  push:
    branches:
      - main
    paths:
      - 'content/articles/es/**.json'
      - 'content/articles/en/**.json'
      - 'content/articles/taxonomies.json'
      - 'content/articles/SEO-CONSOLIDATIONS.json'
      - 'content/tools/build-internal-link-map.py'
      - '.github/workflows/internal-link-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quinnoa-internal-link-map
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate curated internal-link graph
        run: |
          set -euo pipefail
          python3 content/tools/build-internal-link-map.py
          python3 content/tools/build-internal-link-map.py --check

      - name: Commit regenerated map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git diff --quiet -- content/articles/INTERNAL-LINK-MAP.json; then
              echo "Internal-link map is already current."
              exit 0
            fi

            git add content/articles/INTERNAL-LINK-MAP.json
            git commit -m "Regenerate internal link map"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main advanced while rebuilding the map; retrying on latest HEAD (attempt $attempt/3)."
            git fetch origin main
            git reset --hard origin/main
            python3 content/tools/build-internal-link-map.py
            python3 content/tools/build-internal-link-map.py --check
          done

          echo "ERROR: Could not publish the regenerated internal-link map after 3 attempts." >&2
          exit 1
