name: Audit live Quinnoa frontend

on:
  workflow_run:
    workflows:
      - Deploy FOOD theme to WordPress
    types:
      - completed
  workflow_dispatch:

jobs:
  live-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_live_audit_key
          chmod 600 ~/.ssh/food_live_audit_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Resolve WordPress public URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          WP_CONFIGS="$(
            ssh -i ~/.ssh/food_live_audit_key "$VPS_USER@$VPS_HOST" '
              for base in /var/www /home /srv/www /usr/share/nginx/html; do
                if [ -d "$base" ]; then
                  find "$base" -maxdepth 7 -type f -name wp-config.php 2>/dev/null
                fi
              done
            ' | sort -u
          )"

          COUNT="$(printf '%s\n' "$WP_CONFIGS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ -z "$WP_CONFIGS" ] || [ "$COUNT" -ne 1 ]; then
            echo "ERROR: No se ha podido identificar una única instalación de WordPress."
            printf '%s\n' "$WP_CONFIGS"
            exit 1
          fi

          WP_ROOT="${WP_CONFIGS%/wp-config.php}"
          SITE_URL="$(
            ssh -i ~/.ssh/food_live_audit_key "$VPS_USER@$VPS_HOST" \
              "WP_ROOT='$WP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail

          print_home_url() {
            WP_ROOT="$1" php -r 'define("WP_USE_THEMES", false); require getenv("WP_ROOT") . "/wp-load.php"; echo home_url("/");'
          }

          if command -v php >/dev/null 2>&1; then
            print_home_url "$WP_ROOT"
            exit 0
          fi

          if ! command -v docker >/dev/null 2>&1 || ! docker ps >/dev/null 2>&1; then
            echo "ERROR: No hay PHP utilizable ni acceso a Docker para consultar WordPress." >&2
            exit 1
          fi

          CANDIDATES=""
          while read -r CID; do
            [ -z "$CID" ] && continue
            CROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then
                  echo "$p"
                  exit 0
                fi
              done
              FOUND="$(find /var/www /app -maxdepth 5 -type f -name wp-load.php 2>/dev/null | head -n 1)"
              [ -n "$FOUND" ] && dirname "$FOUND"
            ' 2>/dev/null || true)"

            if [ -n "$CROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              CANDIDATES="${CANDIDATES}${CID}|${CROOT}\n"
            fi
          done < <(docker ps -q)

          CANDIDATE_COUNT="$(printf '%b' "$CANDIDATES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$CANDIDATE_COUNT" -ne 1 ]; then
            echo "ERROR: Se esperaba un único contenedor WordPress con PHP y se encontraron $CANDIDATE_COUNT." >&2
            exit 1
          fi

          CANDIDATE="$(printf '%b' "$CANDIDATES" | sed '/^$/d' | head -n 1)"
          CONTAINER_ID="${CANDIDATE%%|*}"
          CONTAINER_WP_ROOT="${CANDIDATE#*|}"

          docker exec \
            -e WP_ROOT="$CONTAINER_WP_ROOT" \
            "$CONTAINER_ID" \
            php -r 'define("WP_USE_THEMES", false); require getenv("WP_ROOT") . "/wp-load.php"; echo home_url("/");'
          REMOTE
          )"

          if [[ ! "$SITE_URL" =~ ^https?:// ]]; then
            echo "ERROR: WordPress devolvió una URL pública no válida: $SITE_URL"
            exit 1
          fi

          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "URL pública de WordPress: $SITE_URL"

      - name: Verify live GA4 tag and consent defaults
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --user-agent 'Quinnoa live deployment audit/1.0' \
            "$SITE_URL" > /tmp/quinnoa-live-home.html

          grep -F 'googletagmanager.com/gtag/js?id=G-G883FS1RZP' /tmp/quinnoa-live-home.html
          grep -F "gtag('config', 'G-G883FS1RZP'" /tmp/quinnoa-live-home.html
          grep -F "'analytics_storage': 'denied'" /tmp/quinnoa-live-home.html
          grep -F "'ad_storage': 'denied'" /tmp/quinnoa-live-home.html
          grep -F "'ad_user_data': 'denied'" /tmp/quinnoa-live-home.html
          grep -F "'ad_personalization': 'denied'" /tmp/quinnoa-live-home.html

          echo "GA4 cookieless tag verified on the public WordPress frontend: $SITE_URL"

      - name: Verify GA4 executes in a real browser without analytics cookies
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "ERROR: No se ha encontrado Chrome/Chromium en el runner."
            exit 1
          fi

          rm -rf /tmp/quinnoa-chrome-profile /tmp/quinnoa-netlog.json
          mkdir -p /tmp/quinnoa-chrome-profile

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-background-networking \
            --user-data-dir=/tmp/quinnoa-chrome-profile \
            --virtual-time-budget=8000 \
            --log-net-log=/tmp/quinnoa-netlog.json \
            --net-log-capture-mode=IncludeSensitive \
            "$SITE_URL" \
            >/tmp/quinnoa-chrome.out 2>/tmp/quinnoa-chrome.err || {
              cat /tmp/quinnoa-chrome.err
              exit 1
            }

          python3 - <<'PY'
          from pathlib import Path
          import sqlite3

          netlog = Path('/tmp/quinnoa-netlog.json').read_text(encoding='utf-8', errors='ignore')
          required = [
              'googletagmanager.com/gtag/js?id=G-G883FS1RZP',
              'google-analytics.com/g/collect',
          ]
          missing = [needle for needle in required if needle not in netlog]
          if missing:
              raise SystemExit('Missing browser network requests: ' + ', '.join(missing))

          profile = Path('/tmp/quinnoa-chrome-profile')
          ga_cookies = []
          for db in profile.rglob('Cookies'):
              try:
                  con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
                  rows = con.execute(
                      "SELECT host_key, name FROM cookies WHERE name = '_ga' OR name LIKE '_ga_%'"
                  ).fetchall()
                  con.close()
              except (sqlite3.Error, OSError):
                  continue
              ga_cookies.extend(rows)

          if ga_cookies:
              raise SystemExit('Unexpected Google Analytics cookies found: ' + repr(ga_cookies))

          print('Browser loaded gtag.js, sent a GA4 collect request, and created no _ga/_ga_* cookies.')
          PY
