name: Deploy ads.txt to WordPress root

on:
  push:
    branches:
      - main
    paths:
      - ads.txt
      - .github/workflows/deploy-ads-txt.yml
  workflow_dispatch:

concurrency:
  group: quinnoa-ads-txt-deploy
  cancel-in-progress: true

jobs:
  deploy-ads-txt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ads.txt
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='google.com, pub-3168527008181132, DIRECT, f08c47fec0942fa0'
          test -f ads.txt
          test "$(wc -l < ads.txt | tr -d ' ')" -eq 1
          grep -Fxq "$EXPECTED" ads.txt

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_deploy_key
          chmod 600 ~/.ssh/food_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Detect WordPress installation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          WP_CONFIGS="$(
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" '
              for base in /var/www /home /srv/www /usr/share/nginx/html; do
                if [ -d "$base" ]; then
                  find "$base" -maxdepth 7 -type f -name wp-config.php 2>/dev/null
                fi
              done
            ' | sort -u
          )"

          if [ -z "$WP_CONFIGS" ]; then
            echo "ERROR: No se ha encontrado wp-config.php en las rutas habituales del VPS."
            exit 1
          fi

          COUNT="$(printf '%s\n' "$WP_CONFIGS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Se han encontrado varias instalaciones de WordPress; no se tocará ninguna."
            printf '%s\n' "$WP_CONFIGS"
            exit 1
          fi

          WP_ROOT="${WP_CONFIGS%/wp-config.php}"
          echo "WordPress detectado en: $WP_ROOT"
          echo "WP_ROOT=$WP_ROOT" >> "$GITHUB_ENV"

      - name: Install ads.txt in WordPress root
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          REMOTE_TMP="/tmp/quinnoa-ads-${GITHUB_RUN_ID}.txt"

          scp -i ~/.ssh/food_deploy_key ads.txt "$VPS_USER@$VPS_HOST:$REMOTE_TMP"

          if ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" "test -w '$WP_ROOT'"; then
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" \
              "install -m 644 '$REMOTE_TMP' '$WP_ROOT/ads.txt' && rm -f '$REMOTE_TMP'"
          elif ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" 'sudo -n true' 2>/dev/null; then
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" \
              "sudo -n install -m 644 '$REMOTE_TMP' '$WP_ROOT/ads.txt' && rm -f '$REMOTE_TMP'"
          else
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" "rm -f '$REMOTE_TMP'" || true
            echo "ERROR: El usuario de despliegue no puede escribir en la raíz de WordPress y no dispone de sudo sin contraseña."
            exit 1
          fi

      - name: Verify ads.txt on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          LOCAL_SHA="$(sha256sum ads.txt | awk '{print $1}')"
          REMOTE_SHA="$(
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" \
              "test -f '$WP_ROOT/ads.txt' && sha256sum '$WP_ROOT/ads.txt'" \
              | awk '{print $1}'
          )"

          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "ERROR: El ads.txt de producción no coincide con el repositorio."
            exit 1
          fi

          echo "ads.txt instalado y verificado en $WP_ROOT/ads.txt"

      - name: Verify public ads.txt
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='google.com, pub-3168527008181132, DIRECT, f08c47fec0942fa0'

          for attempt in 1 2 3 4 5; do
            BODY="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://www.quinnoa.com/ads.txt?check=${GITHUB_SHA}-${attempt}" | tr -d '\r')" || BODY=''
            BODY="${BODY%$'\n'}"
            if [ "$BODY" = "$EXPECTED" ]; then
              echo "https://www.quinnoa.com/ads.txt responde correctamente."
              exit 0
            fi
            sleep 5
          done

          echo "ERROR: https://www.quinnoa.com/ads.txt todavía no devuelve el contenido esperado."
          exit 1
