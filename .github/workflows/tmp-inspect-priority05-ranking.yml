name: Inspect priority 05 ranking source
on:
  push:
    branches:
      - tmp-quality-priority-05-materialize
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode generator and inspect ranking references
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/priority05-gen.c00 \
            .tmp/priority05-gen.c01 \
            .tmp/priority05-gen.c02 \
            .tmp/priority05-gen.c03 \
            .tmp/priority05-gen.c04a \
            .tmp/priority05-gen.c04b \
            .tmp/priority05-gen.c05a00 \
            .tmp/priority05-gen.c05a010 \
            .tmp/priority05-gen.c05a011 \
            .tmp/priority05-gen.c05a1 \
            .tmp/priority05-gen.c05b \
            .tmp/priority05-gen.c06 > /tmp/priority05.b64
          base64 -d /tmp/priority05.b64 | gzip -d > /tmp/priority05.py
          echo '=== GENERATOR SIZE ==='
          wc -l -c /tmp/priority05.py
          echo '=== RANKING / TARGET REFERENCES ==='
          grep -niE 'rank|ranking|priority|target|ids|score|failed_pair' /tmp/priority05.py | head -n 250 || true
          echo '=== FIRST 220 LINES ==='
          sed -n '1,220p' /tmp/priority05.py
