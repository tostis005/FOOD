name: Fix topic 4 quick answers

on:
  push:
    branches:
      - fix-topic4-quick-answers-916-1035

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-topic4-quick-answers-916-1035
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace generic summaries with direct answers
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import pathlib
          import re
          import subprocess

          LOW, HIGH = 916, 1035

          def visible(fragment: str) -> str:
              text = re.sub(r'<[^>]+>', '', fragment)
              text = html.unescape(text)
              return re.sub(r'\s+', ' ', text).strip()

          def opening_answer(content: str) -> str:
              # Restrict extraction to the actual opening paragraph so a later
              # bold phrase can never be mistaken for the quick answer.
              p = re.search(r'<p\b[^>]*>(.*?)</p\s*>', content, flags=re.I | re.S)
              if p:
                  paragraph = p.group(1)
                  emphasis = re.search(
                      r'<(?:strong|b)\b[^>]*>(.*?)</(?:strong|b)\s*>',
                      paragraph,
                      flags=re.I | re.S,
                  )
                  answer = visible(emphasis.group(1) if emphasis else paragraph)
                  if answer:
                      return answer

              # Defensive fallback for opening markup that is not wrapped in <p>.
              emphasis = re.search(
                  r'<(?:strong|b)\b[^>]*>(.*?)</(?:strong|b)\s*>',
                  content[:4000],
                  flags=re.I | re.S,
              )
              if emphasis:
                  answer = visible(emphasis.group(1))
                  if answer:
                      return answer
              raise ValueError('no usable opening answer found')

          def meta(text: str, limit: int = 160) -> str:
              if len(text) <= limit:
                  return text
              sentences = re.split(r'(?<=[.!?])\s+', text)
              kept = []
              for sentence in sentences:
                  candidate = ' '.join(kept + [sentence])
                  if len(candidate) <= limit:
                      kept.append(sentence)
                  else:
                      break
              if kept:
                  return ' '.join(kept)
              cut = text[:limit - 1].rsplit(' ', 1)[0].rstrip(' ,;:')
              return (cut or text[:limit - 1]).rstrip() + '…'

          def replace_first_json_string(raw: str, key: str, value: str) -> str:
              pattern = re.compile(r'("' + re.escape(key) + r'"\s*:\s*)"(?:\\.|[^"\\])*"')
              encoded = json.dumps(value, ensure_ascii=False)
              updated, count = pattern.subn(lambda m: m.group(1) + encoded, raw, count=1)
              if count != 1:
                  raise ValueError(f'{key}: expected one JSON string, found {count}')
              return updated

          planned = []
          errors = []
          counts = {'es': 0, 'en': 0}

          # Phase 1: parse and validate every target before writing any file.
          for lang in ('es', 'en'):
              for path in sorted(pathlib.Path(f'content/articles/{lang}').rglob('*.json')):
                  try:
                      raw = path.read_text(encoding='utf-8')
                      obj = json.loads(raw)
                      number = int(obj.get('article_number', -1))
                  except Exception as exc:
                      errors.append(f'{path}: parse/article_number error: {exc}')
                      continue

                  if not LOW <= number <= HIGH:
                      continue
                  counts[lang] += 1

                  try:
                      content = obj.get('content_html')
                      if not isinstance(content, str) or not content.strip():
                          raise ValueError('content_html is missing or empty')
                      answer = opening_answer(content)
                      description = meta(answer)
                      updated = replace_first_json_string(raw, 'excerpt', answer)
                      updated = replace_first_json_string(updated, 'meta_description', description)

                      check = json.loads(updated)
                      if check.get('excerpt') != answer:
                          raise ValueError('excerpt verification mismatch')
                      seo = check.get('seo') or {}
                      if seo.get('meta_description') != description:
                          raise ValueError('seo.meta_description verification mismatch')
                      if len(description) > 160:
                          raise ValueError('meta description exceeds 160 characters')

                      planned.append((path, raw, updated, number, lang, answer, description))
                  except Exception as exc:
                      errors.append(f'{path} [article {number}]: {exc}')

          if counts != {'es': 120, 'en': 120}:
              errors.append(f'unexpected target counts: {counts}; expected ES=120 EN=120')

          if errors:
              print('VALIDATION ERRORS BEFORE WRITE:')
              for error in errors:
                  print(' -', error)
              raise SystemExit(1)

          # Phase 2: write only after the whole 240-file target is known-good.
          changed_count = 0
          for path, raw, updated, number, lang, answer, description in planned:
              if updated != raw:
                  path.write_text(updated, encoding='utf-8')
                  changed_count += 1

          generic_es = re.compile(r'^\s*respuesta práctica\b', re.I)
          generic_en = re.compile(r'^\s*(?:a\s+)?practical\s+(?:answer|guide)\b', re.I)
          post_errors = []

          for path, _, _, number, lang, _, _ in planned:
              obj = json.loads(path.read_text(encoding='utf-8'))
              excerpt = str(obj.get('excerpt', '')).strip()
              description = str((obj.get('seo') or {}).get('meta_description', '')).strip()
              generic = generic_es if lang == 'es' else generic_en
              if generic.search(excerpt):
                  post_errors.append(f'generic excerpt remains: {path}')
              if generic.search(description):
                  post_errors.append(f'generic meta_description remains: {path}')

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for filename in changed:
              if not filename.startswith(('content/articles/es/', 'content/articles/en/')):
                  post_errors.append(f'unexpected changed file: {filename}')
                  continue
              try:
                  obj = json.loads(pathlib.Path(filename).read_text(encoding='utf-8'))
                  number = int(obj['article_number'])
              except Exception as exc:
                  post_errors.append(f'cannot validate changed file {filename}: {exc}')
                  continue
              if not LOW <= number <= HIGH:
                  post_errors.append(f'out-of-range article changed: {number} ({filename})')

          if len(changed) != 240:
              post_errors.append(f'expected exactly 240 changed JSON files, got {len(changed)}')

          if post_errors:
              print('POST-WRITE VALIDATION ERRORS:')
              for error in post_errors:
                  print(' -', error)
              raise SystemExit(1)

          print(f'Validated target files: ES={counts["es"]}, EN={counts["en"]}')
          print(f'Changed JSON files: {len(changed)}')
          print('Scope check: only article_number 916-1035 in ES/EN changed')
          PY

      - name: Run editorial audit
        run: python content/tools/audit-article-editorial.py

      - name: Commit corrected JSON files
        shell: bash
        run: |
          if git diff --quiet -- content/articles/es content/articles/en; then
            echo "No article changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en
          git commit -m "Fix quick answers in articles 916-1035"
          git push origin HEAD:fix-topic4-quick-answers-916-1035
