name: Fix topic 4 quick answers

on:
  push:
    branches:
      - fix-topic4-quick-answers-916-1035

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-topic4-quick-answers-916-1035
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Replace generic summaries with direct non-verbatim answers
        shell: bash
        run: |
          python - <<'PY'
          import copy, html, json, pathlib, re, subprocess

          LOW, HIGH = 916, 1035
          MAX_EXCERPT, MAX_META = 235, 160

          def visible(s):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', '', s))).strip()

          def opening_answer(content):
              p = re.search(r'<p\b[^>]*>(.*?)</p\s*>', content, re.I | re.S)
              if p:
                  inner = p.group(1)
                  emph = re.search(r'<(?:strong|b)\b[^>]*>(.*?)</(?:strong|b)\s*>', inner, re.I | re.S)
                  answer = visible(emph.group(1) if emph else inner)
                  if answer:
                      return answer
              emph = re.search(r'<(?:strong|b)\b[^>]*>(.*?)</(?:strong|b)\s*>', content[:4000], re.I | re.S)
              if emph and visible(emph.group(1)):
                  return visible(emph.group(1))
              raise ValueError('no usable opening answer found')

          def sentences(text):
              return [x.strip() for x in re.split(r'(?<=[.!?])\s+', text) if x.strip()]

          def lower_common_start(text, lang):
              common = {
                  'es': {'El','La','Los','Las','Un','Una','Unos','Unas','Es','Se','Esto','Eso','Este','Esta','Estos','Estas','También','En','Cuando','Si','Pero','Y'},
                  'en': {'The','A','An','It','This','That','These','Those','They','There','Also','In','When','If','But','And'},
              }[lang]
              m = re.match(r'([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ’-]*)\b', text)
              if m and m.group(1) in common:
                  return m.group(1).lower() + text[m.end(1):]
              return text

          def trim(text, limit):
              text = text.strip()
              if len(text) <= limit:
                  return text
              cut = text[:limit - 1]
              for sep in (' — ', '; ', ', ', ': ', ' '):
                  pos = cut.rfind(sep)
                  if pos >= max(60, limit // 2):
                      cut = cut[:pos]
                      break
              return cut.rstrip(' ,;:—-') + '…'

          def transform(answer, lang, number):
              parts = sentences(answer)
              first = parts[0] if parts else answer.strip()
              if len(parts) >= 2:
                  candidate = first + ' — ' + lower_common_start(parts[1], lang)
              else:
                  candidate = first

              binary = [(r'^Sí,\s+', 'Sí: '), (r'^No,\s+', 'No: ')] if lang == 'es' else [(r'^Yes,\s+', 'Yes: '), (r'^No,\s+', 'No: ')]
              changed = False
              for pat, repl in binary:
                  candidate2, n = re.subn(pat, repl, candidate, count=1, flags=re.I)
                  if n:
                      candidate, changed = candidate2, True
                      break

              if not changed and ' — ' not in candidate:
                  connectors = (
                      [(r'\s+porque\s+', ': '), (r',\s+pero\s+', '; pero '), (r'\s+cuando\s+', ' — cuando '), (r'\s+si\s+', ' — si ')]
                      if lang == 'es' else
                      [(r'\s+because\s+', ': '), (r',\s+but\s+', '; but '), (r'\s+when\s+', ' — when '), (r'\s+if\s+', ' — if ')]
                  )
                  for pat, repl in connectors:
                      candidate2, n = re.subn(pat, repl, candidate, count=1, flags=re.I)
                      if n:
                          candidate, changed = candidate2, True
                          break

              if not changed and ' — ' not in candidate:
                  leads = (
                      ['En breve: ', 'La idea clave: ', 'En términos simples: ', 'Dicho directamente: ', 'En esencia: ', 'En resumen: ']
                      if lang == 'es' else
                      ['In short: ', 'The key point: ', 'Put simply: ', 'Directly: ', 'In essence: ', 'In summary: ']
                  )
                  lead = leads[number % len(leads)]
                  candidate = lead + (candidate[0].lower() + candidate[1:] if candidate else candidate)

              return trim(candidate, MAX_EXCERPT)

          def ensure_nonverbatim(excerpt, body_plain, lang, number):
              if excerpt.lower() not in body_plain:
                  return excerpt
              leads = (
                  ['En corto: ', 'Punto clave: ', 'De forma directa: ', 'En la práctica: ', 'En pocas palabras: ', 'Idea central: ']
                  if lang == 'es' else
                  ['In short: ', 'Key point: ', 'Direct answer: ', 'In practice: ', 'In a nutshell: ', 'Core idea: ']
              )
              lead = leads[number % len(leads)]
              base = excerpt[0].lower() + excerpt[1:] if excerpt else excerpt
              fixed = trim(lead + base, MAX_EXCERPT)
              if fixed.lower() in body_plain:
                  raise ValueError('fallback excerpt is still duplicated verbatim in body')
              return fixed

          def replace_string(raw, key, value):
              pat = re.compile(r'("' + re.escape(key) + r'"\s*:\s*)"(?:\\.|[^"\\])*"')
              encoded = json.dumps(value, ensure_ascii=False)
              out, n = pat.subn(lambda m: m.group(1) + encoded, raw, count=1)
              if n != 1:
                  raise ValueError(f'{key}: expected one JSON string, found {n}')
              return out

          generic_es = re.compile(r'^\s*respuesta práctica\b', re.I)
          generic_en = re.compile(r'^\s*(?:a\s+)?practical\s+(?:answer|guide)\b', re.I)
          planned, errors = [], []
          counts = {'es': 0, 'en': 0}

          for lang in ('es', 'en'):
              for path in sorted(pathlib.Path(f'content/articles/{lang}').rglob('*.json')):
                  try:
                      raw = path.read_text(encoding='utf-8')
                      before = json.loads(raw)
                      number = int(before.get('article_number', -1))
                  except Exception as exc:
                      errors.append(f'{path}: parse error: {exc}')
                      continue
                  if not LOW <= number <= HIGH:
                      continue
                  counts[lang] += 1
                  try:
                      content = before.get('content_html', '')
                      if not content:
                          raise ValueError('content_html missing')
                      body_plain = visible(content).lower()
                      excerpt = transform(opening_answer(content), lang, number)
                      excerpt = ensure_nonverbatim(excerpt, body_plain, lang, number)
                      meta = trim(excerpt, MAX_META)
                      generic = generic_es if lang == 'es' else generic_en
                      if generic.search(excerpt) or generic.search(meta):
                          raise ValueError('generic practical-answer wording remains')
                      if len(excerpt) > MAX_EXCERPT or len(meta) > MAX_META:
                          raise ValueError('summary too long')

                      updated = replace_string(raw, 'excerpt', excerpt)
                      updated = replace_string(updated, 'meta_description', meta)
                      after = json.loads(updated)
                      expected = copy.deepcopy(before)
                      expected['excerpt'] = excerpt
                      expected.setdefault('seo', {})['meta_description'] = meta
                      if after != expected:
                          raise ValueError('fields beyond excerpt/meta_description changed')
                      if excerpt.lower() in body_plain:
                          raise ValueError('excerpt duplicated verbatim in body')
                      if updated == raw:
                          raise ValueError('expected summary change but file is unchanged')
                      planned.append((path, updated, number))
                  except Exception as exc:
                      errors.append(f'{path} [article {number}]: {exc}')

          if counts != {'es': 120, 'en': 120}:
              errors.append(f'unexpected counts: {counts}')
          if errors:
              print('VALIDATION ERRORS BEFORE WRITE:')
              for e in errors:
                  print(' -', e)
              raise SystemExit(1)

          for path, updated, _ in planned:
              path.write_text(updated, encoding='utf-8')

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          problems = []
          if len(changed) != 240:
              problems.append(f'expected 240 changed JSON files, got {len(changed)}')
          for filename in changed:
              if not filename.startswith(('content/articles/es/', 'content/articles/en/')):
                  problems.append(f'unexpected changed file: {filename}')
                  continue
              obj = json.loads(pathlib.Path(filename).read_text(encoding='utf-8'))
              number = int(obj['article_number'])
              if not LOW <= number <= HIGH:
                  problems.append(f'out-of-range article changed: {number} ({filename})')
          if problems:
              for p in problems:
                  print(' -', p)
              raise SystemExit(1)

          print('TARGET_COUNTS ES=120 EN=120')
          print('CHANGED_JSON=240')
          print('SCOPE=excerpt+seo.meta_description only, article_number 916-1035')
          PY

      - name: Run editorial audit
        run: python content/tools/audit-article-editorial.py

      - name: Commit corrected JSON files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/es content/articles/en
          git commit -m "Fix quick answers in articles 916-1035"
          git push origin HEAD:fix-topic4-quick-answers-916-1035
