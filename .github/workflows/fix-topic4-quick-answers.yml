name: Fix topic 4 quick-answer openings

on:
  push:
    branches:
      - fix-topic4-quick-answers-916-1035

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-topic4-quick-answers-916-1035
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect, restore metadata, and fix only opening labels
        shell: bash
        run: |
          python - <<'PY'
          import copy, html, json, pathlib, re, subprocess

          BASE = 'a393de14969a9a4e4d35dd30e9618621dfa8bb5e'
          LOW, HIGH = 916, 1035

          def load(raw):
              return json.loads(raw)

          def visible(s):
              return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', '', s))).strip()

          def first_paragraph(content):
              m = re.search(r'<p\b[^>]*>(.*?)</p\s*>', content, re.I | re.S)
              return visible(m.group(1)) if m else ''

          def base_raw(path):
              return subprocess.check_output(['git', 'show', f'{BASE}:{path.as_posix()}'], text=True)

          def replace_json_string(raw, key, value):
              pat = re.compile(r'("' + re.escape(key) + r'"\s*:\s*)"(?:\\.|[^"\\])*"')
              encoded = json.dumps(value, ensure_ascii=False)
              out, n = pat.subn(lambda m: m.group(1) + encoded, raw, count=1)
              if n != 1:
                  raise ValueError(f'{key}: expected exactly one string, found {n}')
              return out

          def target_paths():
              found = []
              for lang in ('es', 'en'):
                  for p in pathlib.Path(f'content/articles/{lang}').glob('*.json'):
                      obj = load(p.read_text(encoding='utf-8'))
                      n = int(obj.get('article_number', -1))
                      if LOW <= n <= HIGH:
                          found.append((lang, n, p))
              return sorted(found, key=lambda x: (x[0], x[1]))

          all_json = []
          for lang in ('es', 'en'):
              for p in pathlib.Path(f'content/articles/{lang}').glob('*.json'):
                  obj = load(base_raw(p) if int(load(p.read_text(encoding='utf-8')).get('article_number', -1)) in (913,914,915) else p.read_text(encoding='utf-8'))
                  all_json.append((lang, int(obj.get('article_number', -1)), p))

          print('=== PRE-WRITE INSPECTION ===')
          samples = {913,914,915,916,917,975,1016,1035}
          for lang, n, p in sorted(all_json, key=lambda x:(x[1],x[0])):
              if n in samples:
                  raw = base_raw(p) if n <= 1035 else p.read_text(encoding='utf-8')
                  obj = load(raw)
                  print(f'{lang.upper()} {n} {p}: {first_paragraph(obj.get("content_html", ""))[:320]}')

          targets = target_paths()
          counts = {'es': 0, 'en': 0}
          for lang, _, _ in targets:
              counts[lang] += 1
          if counts != {'es': 120, 'en': 120}:
              raise SystemExit(f'Unexpected target counts: {counts}')

          prefix_patterns = {
              'es': re.compile(r'(<p\b[^>]*>\s*(?:(?:<strong|b)\b[^>]*>\s*)?)(?:respuesta\s+práctica|respuesta\s+rápida)\s*:?\s*', re.I),
              'en': re.compile(r'(<p\b[^>]*>\s*(?:(?:<strong|b)\b[^>]*>\s*)?)(?:(?:a\s+)?practical\s+(?:answer|guide)|quick\s+answer)\s*:?\s*', re.I),
          }
          generic_visible = {
              'es': re.compile(r'^\s*(?:respuesta\s+práctica|respuesta\s+rápida)\b', re.I),
              'en': re.compile(r'^\s*(?:(?:a\s+)?practical\s+(?:answer|guide)|quick\s+answer)\b', re.I),
          }

          fixed = {'es': 0, 'en': 0}
          changed_paths = []
          for lang, n, p in targets:
              before_raw = p.read_text(encoding='utf-8')
              before = load(before_raw)
              original_raw = base_raw(p)
              original = load(original_raw)

              # The previous faulty automation touched excerpt/meta_description.
              # Start from the confirmed pre-correction file so those fields and
              # every other forbidden field are restored byte-for-byte.
              desired_raw = original_raw
              content = original.get('content_html', '')
              if not isinstance(content, str) or not content:
                  raise ValueError(f'{p}: missing content_html')

              new_content, hit = prefix_patterns[lang].subn(r'\1', content, count=1)
              if hit:
                  fixed[lang] += 1
                  desired_raw = replace_json_string(desired_raw, 'content_html', new_content)

              desired = load(desired_raw)
              expected = copy.deepcopy(original)
              expected['content_html'] = new_content
              if desired != expected:
                  raise ValueError(f'{p}: parsed delta is not limited to content_html versus {BASE}')

              if generic_visible[lang].search(first_paragraph(new_content)):
                  raise ValueError(f'{p}: generic quick-answer label remains in opening paragraph')

              # Every field except content_html must equal the confirmed base exactly.
              check = copy.deepcopy(desired)
              base_check = copy.deepcopy(original)
              check.pop('content_html', None)
              base_check.pop('content_html', None)
              if check != base_check:
                  raise ValueError(f'{p}: forbidden field differs from base')

              if desired_raw != before_raw:
                  p.write_text(desired_raw, encoding='utf-8')
                  changed_paths.append(p.as_posix())

          print(f'PREFIX_FIXES_ES={fixed["es"]}')
          print(f'PREFIX_FIXES_EN={fixed["en"]}')
          print(f'TARGET_JSON_ES={counts["es"]}')
          print(f'TARGET_JSON_EN={counts["en"]}')

          # Scope validation on the resulting working tree.
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          article_changed = [x for x in changed if x.startswith(('content/articles/es/', 'content/articles/en/'))]
          for filename in article_changed:
              obj = load(pathlib.Path(filename).read_text(encoding='utf-8'))
              n = int(obj['article_number'])
              if not LOW <= n <= HIGH:
                  raise ValueError(f'Out-of-scope article changed: {n} {filename}')
          print(f'ARTICLE_JSON_CHANGED={len(article_changed)}')

          # Compare every target to the confirmed base: only content_html may differ.
          body_diffs = 0
          for lang, n, p in targets:
              cur = load(p.read_text(encoding='utf-8'))
              old = load(base_raw(p))
              if cur.get('content_html') != old.get('content_html'):
                  body_diffs += 1
              cur2, old2 = copy.deepcopy(cur), copy.deepcopy(old)
              cur2.pop('content_html', None); old2.pop('content_html', None)
              if cur2 != old2:
                  raise ValueError(f'Metadata/non-body drift remains in article {n} {lang}')
          print(f'CONTENT_HTML_DIFFS_VS_BASE={body_diffs}')
          print('SCOPE_CHECK=PASS')
          PY

      - name: Validate all JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('content/articles').glob('*/*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('JSON_OK=1')
          PY

      - name: Run editorial audit
        run: python3 content/tools/audit-article-editorial.py

      - name: Run comparison audit
        run: python3 content/tools/audit-article-comparisons.py content/articles

      - name: Commit validated correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-topic4-quick-answers.yml
          git add content/articles/es content/articles/en
          git commit -m "Correct quick-answer openings in articles 916-1035"
          git push origin HEAD:fix-topic4-quick-answers-916-1035
