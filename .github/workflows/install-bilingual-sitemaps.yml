name: Install bilingual sitemaps

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-bilingual-sitemaps.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load sitemap module from theme functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('functions.php')
          text = path.read_text(encoding='utf-8')
          if "inc/sitemaps.php" not in text:
              block = "\n\n$food_sitemaps = get_template_directory() . '/inc/sitemaps.php';\nif ( file_exists( $food_sitemaps ) ) {\n\trequire_once $food_sitemaps;\n}\n"
              path.write_text(text.rstrip() + block + "\n", encoding='utf-8')
          PY

      - name: Validate PHP
        run: |
          php -l functions.php
          php -l inc/sitemaps.php

      - name: Commit sitemap loader
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- functions.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions.php
          git commit -m 'Enable bilingual sitemap endpoints'
          git push
