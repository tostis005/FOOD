name: Deploy FOOD theme to WordPress

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: food-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build runtime CSS bundle
        shell: bash
        run: |
          set -euo pipefail
          output='assets/css/quinnoa-ui.css'
          sources=(
            'assets/css/food-v4.css'
            'assets/css/food-v5.css'
            'assets/css/food-v6.css'
            'assets/css/food-v6-icons.css'
            'assets/css/pommelo-v1.css'
            'assets/css/pommelo-v2.css'
            'assets/css/pommelo-v3.css'
            'assets/css/pommelo-v4.css'
            'assets/css/pommelo-v5-icons.css'
            'assets/css/pommelo-v6-artwork.css'
            'assets/css/pommelo-v6-optical-tune.css'
            'assets/css/pometum-v1.css'
            'assets/css/pometum-v2.css'
            'assets/css/pometum-v3.css'
            'assets/css/pometum-v4.css'
            'assets/css/pometum-v5-mobile-centering.css'
            'assets/css/pometum-v6-ui.css'
            'assets/css/pometum-v7-polish.css'
          )

          : > "$output"
          printf '/* Quinnoa runtime UI bundle. Generated during deployment; edit source fragments, not this file. */\n\n' >> "$output"
          for source in "${sources[@]}"; do
            test -f "$source"
            printf '\n/* ===== %s ===== */\n' "$source" >> "$output"
            cat "$source" >> "$output"
            printf '\n' >> "$output"
          done
          test -s "$output"

      - name: Validate theme PHP before deploy
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_deploy_key
          chmod 600 ~/.ssh/food_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/food_deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'echo "SSH connection OK"'

      - name: Detect WordPress installation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          WP_CONFIGS="$(
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" '
              for base in /var/www /home /srv/www /usr/share/nginx/html; do
                if [ -d "$base" ]; then
                  find "$base" -maxdepth 7 -type f -name wp-config.php 2>/dev/null
                fi
              done
            ' | sort -u
          )"

          if [ -z "$WP_CONFIGS" ]; then
            echo "ERROR: No se ha encontrado wp-config.php en las rutas habituales del VPS."
            exit 1
          fi

          COUNT="$(printf '%s\n' "$WP_CONFIGS" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Se han encontrado varias instalaciones de WordPress. No se desplegará para evitar tocar la web equivocada:"
            printf '%s\n' "$WP_CONFIGS"
            exit 1
          fi

          WP_ROOT="${WP_CONFIGS%/wp-config.php}"
          echo "WordPress detectado en: $WP_ROOT"
          echo "WP_ROOT=$WP_ROOT" >> "$GITHUB_ENV"

      - name: Determine deploy permissions
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          TARGET="$WP_ROOT/wp-content/themes/food"

          if ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p '$TARGET' 2>/dev/null && test -w '$TARGET'"; then
            echo "Despliegue con permisos normales."
            echo "DEPLOY_MODE=user" >> "$GITHUB_ENV"
          elif ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" 'sudo -n true' 2>/dev/null; then
            echo "El usuario necesita sudo; sudo sin contraseña está disponible."
            ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" "sudo -n mkdir -p '$TARGET'"
            echo "DEPLOY_MODE=sudo" >> "$GITHUB_ENV"
          else
            echo "ERROR: VPS_USER puede entrar por SSH, pero no puede escribir en $TARGET y tampoco dispone de sudo sin contraseña."
            echo "En el VPS hay que dar a VPS_USER permiso de escritura sobre wp-content/themes o permitir sudo sin contraseña para mkdir/rsync."
            exit 1
          fi

      - name: Deploy theme with rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          TARGET="$WP_ROOT/wp-content/themes/food/"

          RSYNC_ARGS=(
            -az
            --delete
            --exclude=.git/
            --exclude=.github/
            --exclude=content/
            --exclude=README.md
            -e "ssh -i ~/.ssh/food_deploy_key"
          )

          if [ "$DEPLOY_MODE" = "sudo" ]; then
            RSYNC_ARGS+=(--rsync-path="sudo -n rsync")
          fi

          rsync "${RSYNC_ARGS[@]}" ./ "$VPS_USER@$VPS_HOST:$TARGET"

      - name: Set safe file permissions
        if: env.DEPLOY_MODE == 'sudo'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          TARGET="$WP_ROOT/wp-content/themes/food"
          ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" \
            "sudo -n find '$TARGET' -type d -exec chmod 755 {} + && sudo -n find '$TARGET' -type f -exec chmod 644 {} +"

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          TARGET="$WP_ROOT/wp-content/themes/food"
          ssh -i ~/.ssh/food_deploy_key "$VPS_USER@$VPS_HOST" \
            "test -f '$TARGET/style.css' && test -f '$TARGET/functions.php' && test -s '$TARGET/assets/css/quinnoa-ui.css'"
          echo "FOOD desplegado correctamente en $TARGET"
