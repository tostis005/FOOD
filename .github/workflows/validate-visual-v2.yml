name: Validate visual v2

on:
  push:
    branches:
      - visual-v2-dynamic-home
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint PHP theme files
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
