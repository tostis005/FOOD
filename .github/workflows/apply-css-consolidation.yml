name: Apply CSS consolidation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-css-consolidation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CSS consolidation
        run: python3 scripts/apply_css_consolidation.py

      - name: Validate PHP
        run: |
          php -l header.php
          php -l single.php

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- header.php single.php; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add header.php single.php
          git commit -m 'Load one consolidated Quinnoa stylesheet'
          git push
