name: Verify Quinnoa CSS bundle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-css-bundle.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install browser dependency
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Compare browser-parsed CSS rules
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-css.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';

          const sourcePaths = [
            'assets/css/food-v4.css',
            'assets/css/food-v5.css',
            'assets/css/food-v6.css',
            'assets/css/food-v6-icons.css',
            'assets/css/pommelo-v1.css',
            'assets/css/pommelo-v2.css',
            'assets/css/pommelo-v3.css',
            'assets/css/pommelo-v4.css',
            'assets/css/pommelo-v5-icons.css',
            'assets/css/pommelo-v6-artwork.css',
            'assets/css/pommelo-v6-optical-tune.css',
            'assets/css/pometum-v1.css',
            'assets/css/pometum-v2.css',
            'assets/css/pometum-v3.css',
            'assets/css/pometum-v4.css',
            'assets/css/pometum-v5-mobile-centering.css',
            'assets/css/pometum-v6-ui.css',
            'assets/css/pometum-v7-polish.css'
          ];
          const sourceCss = sourcePaths.map(path => fs.readFileSync(path, 'utf8'));
          const bundleCss = fs.readFileSync('assets/css/quinnoa-ui.css', 'utf8');

          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox'] });
          const page = await browser.newPage();
          const result = await page.evaluate(({ sourceCss, bundleCss }) => {
            const parse = (css) => {
              const sheet = new CSSStyleSheet();
              sheet.replaceSync(css);
              return Array.from(sheet.cssRules, rule => rule.cssText);
            };
            const separate = sourceCss.flatMap(parse);
            const bundled = parse(bundleCss);
            return {
              same: JSON.stringify(separate) === JSON.stringify(bundled),
              separateCount: separate.length,
              bundledCount: bundled.length,
              firstDifference: separate.findIndex((rule, i) => rule !== bundled[i])
            };
          }, { sourceCss, bundleCss });
          await browser.close();

          console.log(JSON.stringify(result));
          if (!result.same) process.exit(1);
          NODE
          node verify-css.mjs

      - name: Verify live theme stylesheet count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import urllib.request

          url = 'https://www.quinnoa.com/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Quinnoa CSS audit'})
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          links = re.findall(r'<link\b[^>]*rel=["\'][^"\']*stylesheet[^"\']*["\'][^>]*>', html, flags=re.I)
          hrefs = []
          for link in links:
              match = re.search(r'href=["\']([^"\']+)', link, flags=re.I)
              if match:
                  hrefs.append(match.group(1))
          theme = [href for href in hrefs if '/wp-content/themes/food/' in href]
          print('Theme stylesheets:', len(theme))
          for href in theme:
              print(href)
          if len(theme) != 3:
              raise SystemExit(f'Expected 3 theme CSS requests on homepage, got {len(theme)}')
          if not any('quinnoa-ui.css' in href for href in theme):
              raise SystemExit('quinnoa-ui.css is not loaded live')
          legacy_names = ('food-v4.css','food-v5.css','food-v6.css','pommelo-v1.css','pometum-v1.css','pometum-v7-polish.css')
          if any(any(name in href for name in legacy_names) for href in theme):
              raise SystemExit('An individual legacy CSS file is still loaded live')
          PY
