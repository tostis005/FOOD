name: Verify bilingual sitemaps

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-bilingual-sitemaps.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_sitemap_key
          chmod 600 ~/.ssh/food_sitemap_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Discover live WordPress URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SITE_URL="$(ssh -i ~/.ssh/food_sitemap_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for CID in $(docker ps -q 2>/dev/null || true); do
            ROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then echo "$p"; exit 0; fi
              done
            ' 2>/dev/null || true)"
            if [ -n "$ROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              docker exec "$CID" php -r "require '$ROOT/wp-load.php'; echo home_url('/');"
              exit 0
            fi
          done

          for base in /var/www /home /srv/www /usr/share/nginx/html; do
            [ -d "$base" ] || continue
            WP_LOAD="$(find "$base" -maxdepth 7 -type f -name wp-load.php 2>/dev/null | head -n 1)"
            if [ -n "$WP_LOAD" ] && command -v php >/dev/null 2>&1; then
              ROOT="${WP_LOAD%/wp-load.php}"
              php -r "require '$ROOT/wp-load.php'; echo home_url('/');"
              exit 0
            fi
          done
          exit 1
          REMOTE
          )"
          test -n "$SITE_URL"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "Live site: $SITE_URL"

      - name: Validate sitemap XML and language separation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          base = os.environ['SITE_URL'].rstrip('/') + '/'
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}

          def fetch(path):
              url = base + path
              req = urllib.request.Request(url, headers={'User-Agent': 'Quinnoa sitemap audit'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f'{url} returned {response.status}')
                  content_type = response.headers.get('Content-Type', '')
                  body = response.read()
              if 'xml' not in content_type.lower():
                  raise SystemExit(f'{url} is not XML: {content_type}')
              return url, ET.fromstring(body)

          index_url, index = fetch('sitemap.xml')
          maps = [node.text for node in index.findall('sm:sitemap/sm:loc', ns)]
          expected = [base + 'sitemap-es.xml', base + 'sitemap-en.xml']
          if maps != expected:
              raise SystemExit(f'Unexpected sitemap index: {maps!r}; expected {expected!r}')

          _, es_root = fetch('sitemap-es.xml')
          _, en_root = fetch('sitemap-en.xml')
          es_urls = [node.text for node in es_root.findall('sm:url/sm:loc', ns)]
          en_urls = [node.text for node in en_root.findall('sm:url/sm:loc', ns)]

          if base not in es_urls:
              raise SystemExit('Spanish sitemap is missing the Spanish home page')
          if base + 'acerca-de/' not in es_urls:
              raise SystemExit('Spanish sitemap is missing /acerca-de/')
          if base + 'en/' not in en_urls:
              raise SystemExit('English sitemap is missing /en/')
          if base + 'en/about/' not in en_urls:
              raise SystemExit('English sitemap is missing /en/about/')
          if any('/en/' in url for url in es_urls):
              raise SystemExit('Spanish sitemap contains English URLs')
          if any('/en/' not in url for url in en_urls):
              raise SystemExit('English sitemap contains non-English URLs')
          if len(es_urls) <= 5 or len(en_urls) <= 5:
              raise SystemExit(f'Expected published posts in both maps; got ES={len(es_urls)}, EN={len(en_urls)}')

          print(f'Index OK: {index_url}')
          print(f'Spanish URLs: {len(es_urls)}')
          print(f'English URLs: {len(en_urls)}')
          PY
