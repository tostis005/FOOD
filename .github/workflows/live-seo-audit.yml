name: Audit live Quinnoa SEO

on:
  workflow_run:
    workflows:
      - Deploy FOOD theme to WordPress
    types:
      - completed
  workflow_dispatch:

jobs:
  live-seo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Audit public SEO signals
        env:
          SITE_URL: https://www.quinnoa.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin

          SITE = os.environ['SITE_URL'].rstrip('/') + '/'
          UA = 'Quinnoa live SEO audit/1.0'

          def article(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def article_url(data):
              slug = str(data['slug']).strip('/')
              return urljoin(SITE, ('en/' if data.get('language') == 'en' else '') + slug + '/')

          def fetch(url, follow=True):
              cmd = [
                  'curl', '--fail', '--silent', '--show-error',
                  '--user-agent', UA,
              ]
              if follow:
                  cmd.append('--location')
              cmd.append(url)
              return subprocess.check_output(cmd, text=True)

          def response_headers(url):
              proc = subprocess.run(
                  [
                      'curl', '--silent', '--show-error',
                      '--user-agent', UA,
                      '--dump-header', '-', '--output', '/dev/null',
                      url,
                  ],
                  text=True,
                  capture_output=True,
                  check=True,
              )
              blocks = [block for block in re.split(r'\r?\n\r?\n', proc.stdout.strip()) if block.strip()]
              if not blocks:
                  raise AssertionError(f'No response headers for {url}')
              lines = blocks[-1].splitlines()
              status_match = re.search(r'\s(\d{3})(?:\s|$)', lines[0])
              if not status_match:
                  raise AssertionError(f'Cannot parse status for {url}: {lines[0]}')
              headers = {}
              for line in lines[1:]:
                  if ':' not in line:
                      continue
                  key, value = line.split(':', 1)
                  headers.setdefault(key.strip().lower(), []).append(value.strip())
              return int(status_match.group(1)), headers

          class HeadParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title = []
                  self.links = []
                  self.metas = []
                  self.ids = set()
                  self.toc_hrefs = []
                  self.in_toc = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if attrs.get('id'):
                      self.ids.add(str(attrs['id']))
                  classes = str(attrs.get('class', '')).split()
                  if tag == 'nav' and 'article-toc' in classes:
                      self.in_toc = True
                  if tag == 'title':
                      self.in_title = True
                  elif tag == 'link':
                      self.links.append(attrs)
                  elif tag == 'meta':
                      self.metas.append(attrs)
                  elif tag == 'a' and self.in_toc and str(attrs.get('href', '')).startswith('#'):
                      self.toc_hrefs.append(str(attrs['href'])[1:])

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == 'title':
                      self.in_title = False
                  elif tag == 'nav' and self.in_toc:
                      self.in_toc = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)

          def parse_head(body):
              parser = HeadParser()
              parser.feed(body)
              return parser

          def norm(value):
              return re.sub(r'\s+', ' ', html.unescape(str(value or ''))).strip()

          def json_ld_graph(body):
              blocks = re.findall(
                  r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',
                  body,
                  flags=re.I | re.S,
              )
              nodes = []
              for block in blocks:
                  payload = json.loads(html.unescape(block.strip()))
                  if isinstance(payload, dict) and isinstance(payload.get('@graph'), list):
                      nodes.extend(payload['@graph'])
                  elif isinstance(payload, list):
                      nodes.extend(payload)
                  elif isinstance(payload, dict):
                      nodes.append(payload)
              return [node for node in nodes if isinstance(node, dict)]

          def schema_node(nodes, node_type):
              for node in nodes:
                  value = node.get('@type')
                  types = value if isinstance(value, list) else [value]
                  if node_type in types:
                      return node
              return None

          def link_href(parser, rel=None, hreflang=None):
              for attrs in parser.links:
                  rel_value = str(attrs.get('rel', '')).lower().split()
                  if rel and rel not in rel_value:
                      continue
                  if hreflang and str(attrs.get('hreflang', '')).lower() != hreflang:
                      continue
                  return attrs.get('href', '')
              return ''

          def meta_content(parser, name):
              name = name.lower()
              for attrs in parser.metas:
                  if str(attrs.get('name', '')).lower() == name:
                      return attrs.get('content', '')
              return ''

          def meta_property(parser, property_name):
              property_name = property_name.lower()
              for attrs in parser.metas:
                  if str(attrs.get('property', '')).lower() == property_name:
                      return attrs.get('content', '')
              return ''

          # Short title should retain the brand; long title should not spend
          # additional SERP space on the brand suffix.
          short_en = article('content/articles/en/1005-can-you-eat-raw-potato.json')
          short_es = article('content/articles/es/1005-se-puede-comer-patata-cruda.json')
          consolidations = json.loads(Path('content/articles/SEO-CONSOLIDATIONS.json').read_text(encoding='utf-8'))
          redirected = {int(key) for key in consolidations}

          long_es = None
          for path in sorted(Path('content/articles/es').glob('*.json')):
              candidate = article(path)
              number = int(candidate.get('article_number') or 0)
              base_title = str((candidate.get('seo') or {}).get('title') or candidate.get('title') or '').strip()
              if number not in redirected and 56 <= len(base_title) <= 65:
                  long_es = candidate
                  break
          assert long_es is not None, 'No indexable ES article currently exercises the unbranded-title branch'

          for data in (short_en, long_es):
              url = article_url(data)
              body = fetch(url)
              parser = parse_head(body)
              base_title = str((data.get('seo') or {}).get('title') or data['title']).strip()
              expect_brand = len(base_title) <= 55
              expected_title = base_title + ' | Quinnoa' if expect_brand else base_title
              actual_title = norm(''.join(parser.title))
              assert actual_title == expected_title, (
                  f'Title mismatch for {url}\nExpected: {expected_title}\nActual: {actual_title}'
              )
              assert ('| Quinnoa' in actual_title) is expect_brand, f'Unexpected brand suffix for {url}'
              assert link_href(parser, rel='canonical') == url, f'Canonical mismatch for {url}'
              robots = meta_content(parser, 'robots').lower()
              assert 'noindex' not in robots, f'Indexable article unexpectedly noindex: {url}'
              description = norm(meta_content(parser, 'description'))
              assert 70 <= len(description) <= 160, f'Meta description length {len(description)} for {url}'

              og_image = norm(meta_property(parser, 'og:image'))
              twitter_image = norm(meta_content(parser, 'twitter:image'))
              assert og_image.startswith('https://'), f'Missing HTTPS og:image for {url}'
              assert twitter_image == og_image, f'Twitter/OG image mismatch for {url}'
              assert meta_content(parser, 'twitter:card') == 'summary_large_image', f'Wrong Twitter card for {url}'
              assert int(meta_property(parser, 'og:image:width') or 0) >= 200, f'OG image too narrow for {url}'
              assert int(meta_property(parser, 'og:image:height') or 0) >= 200, f'OG image too short for {url}'
              image_status, _ = response_headers(og_image)
              assert image_status == 200, f'OG image is not publicly reachable for {url}: {image_status}'

          # Validate the structured-data graph exactly as Google receives it.
          schema_body = fetch(en_url)
          schema_nodes = json_ld_graph(schema_body)
          organization = schema_node(schema_nodes, 'Organization')
          website = schema_node(schema_nodes, 'WebSite')
          webpage = schema_node(schema_nodes, 'WebPage')
          article_node = schema_node(schema_nodes, 'Article')
          breadcrumbs = schema_node(schema_nodes, 'BreadcrumbList')

          assert organization is not None, 'Organization schema missing'
          assert website is not None, 'WebSite schema missing'
          assert webpage is not None, 'WebPage schema missing'
          assert article_node is not None, 'Article schema missing'
          assert breadcrumbs is not None, 'BreadcrumbList schema missing'

          org_id = organization.get('@id')
          assert org_id and str(org_id).endswith('#organization'), f'Unexpected Organization @id: {org_id}'
          assert organization.get('name') == 'Quinnoa'
          assert organization.get('url') == SITE
          assert organization.get('publishingPrinciples'), 'Organization publishingPrinciples missing'
          assert (website.get('publisher') or {}).get('@id') == org_id, 'WebSite publisher does not reference Organization'

          assert webpage.get('url') == en_url, f'WebPage URL mismatch: {webpage.get("url")}'
          assert webpage.get('inLanguage') == 'en-US', f'WebPage language mismatch: {webpage.get("inLanguage")}'
          assert (webpage.get('isPartOf') or {}).get('@id') == website.get('@id'), 'WebPage isPartOf mismatch'

          assert article_node.get('headline') == short_en.get('title'), 'Article headline mismatch'
          assert article_node.get('inLanguage') == 'en-US', 'Article language mismatch'
          assert article_node.get('datePublished'), 'Article datePublished missing'
          assert article_node.get('dateModified'), 'Article dateModified missing'
          assert (article_node.get('author') or {}).get('@id') == org_id, 'Article author mismatch'
          assert (article_node.get('publisher') or {}).get('@id') == org_id, 'Article publisher mismatch'
          assert (article_node.get('mainEntityOfPage') or {}).get('@id') == en_url + '#webpage', 'Article mainEntityOfPage mismatch'
          assert article_node.get('publishingPrinciples'), 'Article publishingPrinciples missing'

          crumbs = breadcrumbs.get('itemListElement') or []
          assert len(crumbs) >= 2, 'Breadcrumb schema is too short'
          positions = [int(item.get('position') or 0) for item in crumbs]
          assert positions == list(range(1, len(crumbs) + 1)), f'Breadcrumb positions are not contiguous: {positions}'
          assert crumbs[-1].get('item') == en_url, f'Breadcrumb final URL mismatch: {crumbs[-1].get("item")}'

          # Substantial articles should expose a usable on-page contents list.
          toc_article = article('content/articles/en/064-quinoa-vs-rice-protein-fiber-carbs.json')
          toc_url = article_url(toc_article)
          toc_parser = parse_head(fetch(toc_url))
          assert len(toc_parser.toc_hrefs) >= 4, f'Article TOC missing or too short for {toc_url}'
          for anchor_id in toc_parser.toc_hrefs:
              assert anchor_id in toc_parser.ids, f'TOC target #{anchor_id} does not exist on {toc_url}'
          assert 'article-sources' not in toc_parser.toc_hrefs, f'Sources leaked into TOC for {toc_url}'
          assert 'article-faq' not in toc_parser.toc_hrefs, f'FAQ leaked into TOC for {toc_url}'

          # Translation alternates must point to equivalent pages, not language homes.
          en_url = article_url(short_en)
          es_url = article_url(short_es)
          for data in (short_en, short_es):
              url = article_url(data)
              parser = parse_head(fetch(url))
              assert link_href(parser, rel='alternate', hreflang='en') == en_url, f'Bad EN hreflang for {url}'
              assert link_href(parser, rel='alternate', hreflang='es') == es_url, f'Bad ES hreflang for {url}'
              assert link_href(parser, rel='alternate', hreflang='x-default') == es_url, f'Bad x-default for {url}'

          sitemap_index = fetch(urljoin(SITE, 'sitemap.xml'))
          assert urljoin(SITE, 'sitemap-es.xml') in sitemap_index
          assert urljoin(SITE, 'sitemap-en.xml') in sitemap_index

          sitemap_urls = {}
          for lang in ('es', 'en'):
              xml = fetch(urljoin(SITE, f'sitemap-{lang}.xml'))
              sitemap_urls[lang] = {
                  html.unescape(value.strip())
                  for value in re.findall(r'<loc>(.*?)</loc>', xml, flags=re.I | re.S)
              }

          expected_article_urls = {'es': set(), 'en': set()}
          redirected_article_urls = {'es': set(), 'en': set()}
          for lang in ('es', 'en'):
              for path in sorted(Path('content/articles', lang).glob('*.json')):
                  data = article(path)
                  number = int(data.get('article_number') or 0)
                  url = article_url(data)
                  if number in redirected:
                      redirected_article_urls[lang].add(url)
                  else:
                      expected_article_urls[lang].add(url)

              missing = sorted(expected_article_urls[lang] - sitemap_urls[lang])
              leaked = sorted(redirected_article_urls[lang] & sitemap_urls[lang])
              assert not missing, f'{len(missing)} active {lang.upper()} article URLs missing from sitemap: {missing[:5]}'
              assert not leaked, f'{len(leaked)} redirected {lang.upper()} article URLs leaked into sitemap: {leaked[:5]}'

          robots_txt = fetch(urljoin(SITE, 'robots.txt'))
          assert 'Sitemap: ' + urljoin(SITE, 'sitemap.xml') in robots_txt

          # A consolidated URL must 301 to its older canonical counterpart and
          # must not survive in the language sitemap.
          pairs = [
              (
                  article('content/articles/es/300-prueba-agua-huevos-que-indica.json'),
                  article('content/articles/es/285-por-que-flotan-huevos.json'),
                  'sitemap-es.xml',
              ),
              (
                  article('content/articles/en/300-egg-float-test-what-it-really-means.json'),
                  article('content/articles/en/285-why-eggs-float.json'),
                  'sitemap-en.xml',
              ),
          ]
          for source, target, sitemap_name in pairs:
              source_url = article_url(source)
              target_url = article_url(target)
              status, headers = response_headers(source_url)
              location = (headers.get('location') or [''])[0]
              assert status == 301, f'Expected 301 for {source_url}, got {status}'
              assert location == target_url, f'Bad redirect for {source_url}: {location} != {target_url}'
              sitemap = fetch(urljoin(SITE, sitemap_name))
              assert target_url in sitemap, f'Canonical target missing from {sitemap_name}: {target_url}'
              assert source_url not in sitemap, f'Redirect source still present in {sitemap_name}: {source_url}'

          # Redirect sources must also disappear from public listings. Search
          # for a phrase that strongly matches both the canonical deli-meat
          # guide and its consolidated duplicate: only the canonical URL may
          # be rendered as a card.
          listing_source = article('content/articles/en/1305-how-long-opened-deli-meats-last-fridge.json')
          listing_target = article('content/articles/en/how-long-does-opened-deli-meat-last-and-when-is-it-no-longer-safe.json')
          listing_source_url = article_url(listing_source)
          listing_target_url = article_url(listing_target)
          search_url = urljoin(SITE, 'en/?s=' + quote_plus('opened deli meat'))
          search_html = fetch(search_url)
          assert listing_source_url not in search_html, f'Consolidated source leaked into search results: {listing_source_url}'
          assert listing_target_url in search_html, f'Canonical target missing from search results: {listing_target_url}'

          print('LIVE_SEO_AUDIT=PASS')
          print(f'SHORT_TITLE={article_url(short_en)}')
          print(f'LONG_TITLE={article_url(long_es)}')
          print(f'HREFLANG_PAIR={es_url} <-> {en_url}')
          print('SITEMAPS=PASS')
          print(f'SITEMAP_ES_ACTIVE_ARTICLES={len(expected_article_urls["es"])}')
          print(f'SITEMAP_EN_ACTIVE_ARTICLES={len(expected_article_urls["en"])}')
          print('ROBOTS=PASS')
          print('CONSOLIDATED_REDIRECTS=PASS')
          print('CONSOLIDATED_LISTINGS=PASS')
          print('ARTICLE_TOC=PASS')
          print('STRUCTURED_DATA=PASS')
          PY
