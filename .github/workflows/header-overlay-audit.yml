name: Audit Quinnoa header overlays

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/pometum-language-overlay.js'
      - 'assets/css/pometum-v6-ui.css'
      - 'assets/css/pometum-v7-polish.css'
      - 'header.php'
      - 'footer.php'
      - 'inc/editorial-pages.php'
      - '.github/workflows/header-overlay-audit.yml'
  workflow_dispatch:

jobs:
  audit-header-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_overlay_audit_key
          chmod 600 ~/.ssh/food_overlay_audit_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Discover live URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SITE_URL="$(ssh -i ~/.ssh/food_overlay_audit_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for CID in $(docker ps -q); do
            ROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then echo "$p"; exit 0; fi
              done
            ' 2>/dev/null || true)"
            if [ -n "$ROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              docker exec "$CID" php -r "require '$ROOT/wp-load.php'; echo home_url('/');"
              exit 0
            fi
          done
          exit 1
          REMOTE
          )"
          test -n "$SITE_URL"
          echo "::add-mask::$SITE_URL"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Install browser dependency
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Verify live home and overlays
        run: |
          set -euo pipefail
          cat > header-overlay-audit.mjs <<'NODE'
          import { chromium } from 'playwright-core';

          const base = process.env.SITE_URL.replace(/\/$/, '');
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox'] });

          async function waitForCurrentUI(path, expectedTitle, expectedTagline, width = 390, height = 844) {
            const context = await browser.newContext({ viewport: { width, height } });
            const page = await context.newPage();
            let ready = false;
            for (let i = 0; i < 30; i += 1) {
              const response = await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(500);
              if (response && response.status() === 200) {
                const title = await page.locator('.search-overlay-title').textContent().catch(() => '');
                const tagline = await page.locator('.site-tagline').textContent().catch(() => '');
                if ((title || '').trim() === expectedTitle && (tagline || '').trim() === expectedTagline) {
                  ready = true;
                  break;
                }
              }
              await page.waitForTimeout(2000);
            }
            if (!ready) throw new Error(`${path}: latest UI did not reach production`);
            return { context, page };
          }

          async function backgroundImage(locator) {
            return locator.evaluate((el) => getComputedStyle(el).backgroundImage || '');
          }

          async function quinoaGrain(locator) {
            return locator.evaluate((el) => {
              const style = getComputedStyle(el, '::after');
              return {
                content: style.content,
                backgroundImage: style.backgroundImage,
                borderRadius: style.borderRadius,
                top: style.top,
                width: style.width,
                height: style.height
              };
            });
          }

          {
            const { context, page } = await waitForCurrentUI('/', 'Buscar', 'Natural · Nutrición', 1440, 1000);
            const bodyText = await page.locator('body').innerText();
            if (/critical error|error crítico/i.test(bodyText)) throw new Error('Spanish home shows a critical error');

            const home = await page.evaluate(() => {
              const h1 = document.querySelector('.hero-main-v5 h1');
              const discover = document.querySelector('.discover-grid');
              const rect = h1?.getBoundingClientRect();
              const style = h1 ? getComputedStyle(h1) : null;
              return {
                heroFont: style ? parseFloat(style.fontSize) : null,
                heroHeight: rect ? Math.round(rect.height) : null,
                discoverBorder: discover ? getComputedStyle(discover).borderTopWidth : null,
                footerLinks: [...document.querySelectorAll('.footer-links-v5 a')].map(a => a.textContent.trim())
              };
            });
            if (home.heroFont === null || home.heroFont > 67) throw new Error(`Hero font too large: ${home.heroFont}`);
            if (home.heroHeight === null || home.heroHeight > 230) throw new Error(`Hero headline too tall: ${home.heroHeight}`);
            if (home.discoverBorder !== '0px') throw new Error(`Discovery top rule still visible: ${home.discoverBorder}`);
            if (home.footerLinks.join('|') !== 'Acerca de|Contacto|Privacidad') throw new Error(`Unexpected footer links: ${home.footerLinks.join('|')}`);

            const grain = await quinoaGrain(page.locator('.site-header .quinnoa-i').first());
            if (grain.content === 'none' || grain.backgroundImage === 'none') throw new Error(`Quinoa grain is not rendered: ${JSON.stringify(grain)}`);
            if (grain.width === grain.height) throw new Error(`Quinoa grain is still perfectly circular: ${JSON.stringify(grain)}`);

            await page.click('.search-toggle');
            await page.waitForTimeout(100);
            const search = await page.evaluate(() => ({
              open: document.querySelector('.search-overlay')?.classList.contains('is-open'),
              title: document.querySelector('.search-overlay-title')?.textContent?.trim(),
              placeholder: document.querySelector('#overlay-food-search')?.getAttribute('placeholder'),
              redundantBrand: document.querySelectorAll('.search-overlay-content .search-overlay-eyebrow').length
            }));
            if (!search.open) throw new Error('Spanish search overlay did not open');
            if (search.title !== 'Buscar') throw new Error(`Unexpected Spanish search title: ${search.title}`);
            if (search.placeholder !== 'Escribe tu búsqueda…') throw new Error(`Unexpected Spanish placeholder: ${search.placeholder}`);
            if (search.redundantBrand !== 0) throw new Error('Redundant Quinnoa eyebrow remains inside search content');
            await page.keyboard.press('Escape');

            await page.click('.language-toggle');
            await page.waitForTimeout(100);
            const esFlag = await backgroundImage(page.locator('.language-option[hreflang="es"] .language-option-flag'));
            const usFlag = await backgroundImage(page.locator('.language-option[hreflang="en"] .language-option-flag'));
            if (!esFlag.includes('linear-gradient')) throw new Error(`Spanish graphical flag missing: ${esFlag}`);
            if (!usFlag.includes('data:image/svg+xml')) throw new Error(`US graphical flag missing: ${usFlag}`);
            const flagText = await page.locator('.language-option[hreflang="en"] .language-option-flag').textContent();
            if ((flagText || '').trim() !== '') throw new Error(`English flag contains fallback text: ${flagText}`);
            await context.close();
          }

          {
            const { context, page } = await waitForCurrentUI('/en/', 'Search', 'Natural · Nutrition');
            const bodyText = await page.locator('body').innerText();
            if (/critical error|error crítico/i.test(bodyText)) throw new Error('English home shows a critical error');
            const currentFlag = await backgroundImage(page.locator('.language-current-flag'));
            if (!currentFlag.includes('data:image/svg+xml')) throw new Error(`Current English graphical flag missing: ${currentFlag}`);

            await page.click('.search-toggle');
            await page.waitForTimeout(100);
            const search = await page.evaluate(() => ({
              title: document.querySelector('.search-overlay-title')?.textContent?.trim(),
              placeholder: document.querySelector('#overlay-food-search')?.getAttribute('placeholder'),
              redundantBrand: document.querySelectorAll('.search-overlay-content .search-overlay-eyebrow').length
            }));
            if (search.title !== 'Search') throw new Error(`Unexpected English search title: ${search.title}`);
            if (search.placeholder !== 'Type your search…') throw new Error(`Unexpected English placeholder: ${search.placeholder}`);
            if (search.redundantBrand !== 0) throw new Error('Redundant Quinnoa eyebrow remains inside English search content');
            await context.close();
          }

          await browser.close();
          console.log('Quinnoa home and overlays verified on live site');
          NODE
          node header-overlay-audit.mjs