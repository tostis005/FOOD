name: Audit Pometum header overlays

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/pometum-language-overlay.js'
      - 'header.php'
      - '.github/workflows/header-overlay-audit.yml'
  workflow_dispatch:

jobs:
  audit-header-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/food_overlay_audit_key
          chmod 600 ~/.ssh/food_overlay_audit_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Discover live URL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SITE_URL="$(ssh -i ~/.ssh/food_overlay_audit_key "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for CID in $(docker ps -q); do
            ROOT="$(docker exec "$CID" sh -lc '
              for p in /var/www/html /var/www/wordpress/html /app/public /app; do
                if [ -f "$p/wp-load.php" ]; then echo "$p"; exit 0; fi
              done
            ' 2>/dev/null || true)"
            if [ -n "$ROOT" ] && docker exec "$CID" sh -lc 'command -v php >/dev/null 2>&1' >/dev/null 2>&1; then
              docker exec "$CID" php -r "require '$ROOT/wp-load.php'; echo home_url('/');"
              exit 0
            fi
          done
          exit 1
          REMOTE
          )"
          test -n "$SITE_URL"
          echo "::add-mask::$SITE_URL"
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"

      - name: Install browser dependency
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@latest >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Verify live search and language overlays
        run: |
          set -euo pipefail
          cat > header-overlay-audit.mjs <<'NODE'
          import { chromium } from 'playwright-core';

          const base = process.env.SITE_URL.replace(/\/$/, '');
          const browser = await chromium.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox'] });

          async function waitForCurrentUI(path, expectedTitle) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            const page = await context.newPage();
            let ready = false;
            for (let i = 0; i < 30; i += 1) {
              const response = await page.goto(base + path, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(500);
              if (response && response.status() === 200) {
                const title = await page.locator('.search-overlay-title').textContent().catch(() => '');
                if ((title || '').trim() === expectedTitle) {
                  ready = true;
                  break;
                }
              }
              await page.waitForTimeout(2000);
            }
            if (!ready) throw new Error(`${path}: latest overlay UI did not reach production`);
            return { context, page };
          }

          {
            const { context, page } = await waitForCurrentUI('/', 'Encuentra la información que necesitas');
            const bodyText = await page.locator('body').innerText();
            if (/critical error|error crítico/i.test(bodyText)) throw new Error('Spanish home still shows a critical error');

            await page.click('.search-toggle');
            await page.waitForTimeout(100);
            const search = await page.evaluate(() => ({
              open: document.querySelector('.search-overlay')?.classList.contains('is-open'),
              title: document.querySelector('.search-overlay-title')?.textContent?.trim(),
              placeholder: document.querySelector('#overlay-food-search')?.getAttribute('placeholder')
            }));
            if (!search.open) throw new Error('Spanish search overlay did not open');
            if (search.title !== 'Encuentra la información que necesitas') throw new Error(`Unexpected Spanish search title: ${search.title}`);
            if (search.placeholder !== 'Escribe un alimento o una pregunta…') throw new Error(`Unexpected Spanish placeholder: ${search.placeholder}`);
            await page.keyboard.press('Escape');

            await page.click('.language-toggle');
            await page.waitForTimeout(100);
            const usFlag = await page.locator('.language-option[hreflang="en"] .language-option-flag').textContent();
            if ((usFlag || '').trim() !== '🇺🇸') throw new Error(`English option flag is ${usFlag}`);
            await context.close();
          }

          {
            const { context, page } = await waitForCurrentUI('/en/', 'Find the information you need');
            const bodyText = await page.locator('body').innerText();
            if (/critical error|error crítico/i.test(bodyText)) throw new Error('English home still shows a critical error');
            const currentFlag = await page.locator('.language-current-flag').textContent();
            if ((currentFlag || '').trim() !== '🇺🇸') throw new Error(`Current English flag is ${currentFlag}`);

            await page.click('.search-toggle');
            await page.waitForTimeout(100);
            const search = await page.evaluate(() => ({
              title: document.querySelector('.search-overlay-title')?.textContent?.trim(),
              placeholder: document.querySelector('#overlay-food-search')?.getAttribute('placeholder')
            }));
            if (search.title !== 'Find the information you need') throw new Error(`Unexpected English search title: ${search.title}`);
            if (search.placeholder !== 'Type a food or question…') throw new Error(`Unexpected English placeholder: ${search.placeholder}`);
            await context.close();
          }

          await browser.close();
          console.log('Header overlays verified on live site');
          NODE
          node header-overlay-audit.mjs
